<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cleanearth Site Audit</title>
<meta name="theme-color" content="#0A6A75">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header + scrolling tab strip; one working column on phones, list + detail on wide screens */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --sunken:#F5F8F9; --ink:#10252D; --muted:#566C74; --line:#D3DEE1;
  --accent:#0A6A75; --accent-ink:#FFFFFF; --accent-soft:#DCEEF0;
  --good:#23704A; --good-soft:#DFF1E6; --warn:#9A5B0B; --warn-soft:#FBEBD2; --bad:#B42318; --bad-soft:#FBE1DE;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1518; --surface:#122127; --sunken:#0E1B20; --ink:#E2EDEF; --muted:#90A6AD; --line:#24373E;
  --accent:#4DB6C1; --accent-ink:#06171A; --accent-soft:#143840;
  --good:#5EC58E; --good-soft:#143323; --warn:#E6AB4C; --warn-soft:#3A2A10; --bad:#F2766A; --bad-soft:#3D1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1518; --surface:#122127; --sunken:#0E1B20; --ink:#E2EDEF; --muted:#90A6AD; --line:#24373E;
  --accent:#4DB6C1; --accent-ink:#06171A; --accent-soft:#143840;
  --good:#5EC58E; --good-soft:#143323; --warn:#E6AB4C; --warn-soft:#3A2A10; --bad:#F2766A; --bad-soft:#3D1A17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.mono{font-family:var(--font-mono);font-size:.92em}
.muted{color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.auditname{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sunken);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.ok{color:var(--good);background:var(--good-soft);border-color:transparent}
.status.busy{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.status.err{color:var(--bad);background:var(--bad-soft);border-color:transparent;cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{font-family:var(--font-mono);font-size:11px;margin-left:5px;color:var(--muted)}

main{padding-block:20px 80px}
.banner{margin-bottom:16px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px}
.banner.info{background:var(--accent-soft);color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:500;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sechead h2{font-size:20px}
.cardtitle{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:13px;color:var(--muted)}

/* progress list */
.prog{display:flex;flex-direction:column}
.prog button{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer}
.prog button:first-child{border-top:0}
.meter{grid-column:1/-1;height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.full{background:var(--good)}
.frac{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* flags */
.flags{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.flags li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--sunken)}
.sev{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.sev.bad,.pill.bad{background:var(--bad-soft);color:var(--bad)}
.sev.warn,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.sev.good,.pill.good{background:var(--good-soft);color:var(--good)}
.sev.info,.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}

/* condition bars */
.cbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunken);margin:6px 0 10px}
.cbar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}

/* questionnaire */
.qlayout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.qnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px)}
@media (max-width:820px){.qlayout{grid-template-columns:minmax(0,1fr)}.qnav{position:static}.qlayout.open .qnav{display:none}.qlayout:not(.open) .qform{display:none}}
.qnav .prog button[aria-current="true"]{background:var(--accent-soft);border-radius:6px;padding-inline:8px}
.qform h2{font-size:22px;margin-bottom:4px}
.intro{color:var(--muted);margin:0 0 18px;max-width:65ch}
.q{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.q label.ql,.f label.ql{font-weight:500}
.q .hint,.f .hint{font-size:13px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:9px 11px;min-height:40px}
.inp:focus{border-color:var(--accent);background:var(--surface);outline:none}
textarea.inp{min-height:80px;resize:vertical}
.numwrap{display:flex;align-items:stretch;max-width:340px}
.numwrap .inp{border-top-right-radius:0;border-bottom-right-radius:0;font-variant-numeric:tabular-nums}
.numwrap .unit{display:flex;align-items:center;padding:0 10px;border:1px solid var(--line);border-left:0;border-radius:0 8px 8px 0;background:var(--surface);font-family:var(--font-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.numwrap select.unit{appearance:auto;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.rating button{min-width:42px;font-family:var(--font-mono)}
.computed{margin:6px 0 4px;padding:14px;border-radius:8px;background:var(--accent-soft);display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.computed div b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.computed div span{font-size:12px;color:var(--muted)}
.qfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* registers */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .inp{width:auto;flex:1 1 180px;min-height:38px}
.toolbar select.inp{flex:0 1 200px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .p{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.thumbs{display:flex;gap:6px;margin-top:4px}
.thumbs img{width:48px;height:48px;object-fit:cover;border-radius:6px;background:var(--sunken)}
.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* editor sheet */
.scrim{position:fixed;inset:0;background:rgba(6,20,24,.45);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(620px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;border-bottom:1px solid var(--line)}
.sheet header h3{font-size:18px}
.sheet .body{flex:1;overflow-y:auto;padding-block:8px 24px}
.sheet footer{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.f{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.f:first-child{border-top:0}
.fpair{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.photo{position:relative;width:96px;height:96px}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:8px;background:var(--sunken)}
.photo button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.addphoto{width:96px;height:96px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px;color:var(--muted);cursor:pointer;text-align:center;padding:6px}
.addphoto:hover{border-color:var(--accent);color:var(--accent)}
.codebox{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;background:var(--accent-soft)}
.codebox span{font-size:28px;letter-spacing:.02em;font-weight:500;overflow-wrap:anywhere}
.item .t.code{font-family:var(--font-mono);font-size:17px;font-weight:500}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* audits list */
.audits{display:flex;flex-direction:column;gap:10px}
.audits button.item{flex-direction:row;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;overflow-wrap:anywhere}
@media (max-width:520px){.card{padding:14px}.bar{gap:8px}.status{font-size:11px;padding:3px 8px}#switchBtn{padding:6px 10px;min-height:34px}main{padding-block:14px 60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap gut">
    <div class="bar">
      <div class="brand">
        <span class="eyebrow">Cleanearth site audit</span>
        <span class="auditname" id="auditName">Loading audit…</span>
      </div>
      <span class="status" id="saveStatus">Connecting…</span>
      <button class="btn" id="switchBtn" type="button">All audits</button>
      <button class="btn ghost" id="acctBtn" type="button" data-act="signout" hidden>Sign out</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>

<main class="wrap gut" id="main"></main>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="ce-backend.js"></script>
<script>
/* ---------- schema ---------- */
const AREAS=['Water intake & storage','Water treatment','Production','CIP','Effluent collection','Screening & equalisation','DAF / primary','Biological','Clarification','Tertiary / disinfection','Sludge','Chemical store & dosing','Utilities','Outlet / discharge'];
const EQUIP_CATS=['Pump','Blower / aerator','DAF unit','Dosing pump / skid','Chemical tank','Process tank / basin','Clarifier / settler','Screen','Mixer / agitator','Sludge dewatering','Filter','Reverse osmosis','Softener','UV / disinfection','CIP unit','Heat exchanger','Instrument / meter','Control panel / PLC','Generator / electrical','Pipework / valve','Other'];
const YN=['Yes','No','Unknown'];
const POINTS=[['Raw water','RW'],['Treated water','TW'],['Production drain','PD'],['CIP discharge','CIP'],['WWTP inlet','IN'],['After equalisation','EQ'],['After DAF','DAF'],['Biological reactor','BR'],['Clarifier outlet','CO'],['Final outlet','FO'],['Receiving water','RCV'],['Other','OT']];
const POINT_NAMES=POINTS.map(p=>p[0]);const POINT_CODE=Object.fromEntries(POINTS);
const defaultParams=p=>['Raw water','Treated water'].includes(p)?['pH','Turbidity','TDS','E. coli']:['pH','BOD','COD','TSS','FOG'];

const SECTIONS=[
 {id:'site',title:'Site and facility',intro:'Layout, space and how the site runs. Estimate areas on the walk-through if no drawings are available.',qs:[
  {id:'site_area',label:'Total site area',type:'number',unit:'m²'},
  {id:'wwtp_footprint',label:'WWTP footprint',type:'number',unit:'m²'},
  {id:'free_space',label:'Free space available for new treatment units',type:'number',unit:'m²'},
  {id:'free_space_loc',label:'Where is the free space, and what limits it?',type:'textarea'},
  {id:'access',label:'Access for trucks and cranes to the WWTP',type:'chips',options:['Good','Restricted','None']},
  {id:'flood',label:'Flooding or drainage problems around the WWTP',type:'chips',options:YN},
  {id:'prod_days',label:'Production days per week',type:'number',unit:'days'},
  {id:'shifts',label:'Shifts per day',type:'number'},
  {id:'staff',label:'Total staff on site',type:'number'},
  {id:'expansion',label:'Planned production expansion (next 3 years)',type:'textarea'},
  {id:'contacts',label:'Client contacts met (name, role, phone)',type:'textarea'}]},
 {id:'water',title:'Water supply and treatment',intro:'Sources, volumes and the water treatment train. Record each treatment unit in the Equipment register.',qs:[
  {id:'sources',label:'Water sources',type:'multi',options:['GWCL mains','Borehole','Tanker','Rainwater','Other']},
  {id:'boreholes',label:'Number of boreholes',type:'number'},
  {id:'consumption',label:'Average water consumption',type:'number',unit:'m³/day'},
  {id:'metered',label:'Is water intake metered?',type:'chips',options:YN},
  {id:'storage',label:'Raw water storage volume',type:'number',unit:'m³'},
  {id:'wtp_units',label:'Treatment units present',type:'multi',options:['Sand / multimedia filter','Activated carbon','Softener','Reverse osmosis','Ultrafiltration','Iron removal','UV','Chlorination','Other']},
  {id:'wtp_capacity',label:'Water treatment capacity',type:'number',unit:'m³/h'},
  {id:'wtp_reject',label:'Where do backwash, brine and RO reject go?',type:'chips',options:['To WWTP','To storm drain','To sewer','Reused','Unknown']},
  {id:'raw_quality',label:'Raw water quality issues (hardness, iron, salinity)',type:'textarea'},
  {id:'wtp_monitor',label:'Is treated water quality monitored?',type:'chips',options:YN},
  {id:'water_ratio',label:'Water use per litre of product (if known)',type:'number',unit:'L/L'}]},
 {id:'production',title:'Production and wastewater sources',intro:'Where the load comes from. Record each line in Product lines.',qs:[
  {id:'main_sources',label:'Main wastewater-generating activities',type:'multi',options:['Mixing / batching','Pasteurisation','Homogenisation','Freezing','Filling / packing','CIP','Floor washing','Crate / tray washing','Boiler blowdown','Cooling tower bleed','Laboratory','Canteen / toilets']},
  {id:'losses',label:'Are product losses or rejected batches sent to drain?',type:'chips',options:['Never','Sometimes','Often','Unknown']},
  {id:'recovery',label:'Product recovery practice (pigging, first-rinse recovery, rework)',type:'textarea'},
  {id:'segregation',label:'Are high-strength streams kept separate?',type:'chips',options:YN},
  {id:'domestic',label:'Is domestic sewage mixed with process effluent?',type:'chips',options:YN},
  {id:'storm',label:'Does stormwater enter the effluent drains?',type:'chips',options:YN},
  {id:'grease_traps',label:'Grease traps',type:'chips',options:['Present, maintained','Present, poorly maintained','None']},
  {id:'trap_cleaning',label:'Grease trap cleaning frequency',type:'text'},
  {id:'hot_streams',label:'Hot discharges (source and approximate temperature)',type:'textarea'}]},
 {id:'wwtp',title:'WWTP design and capacity',intro:'Compare design capacity with today’s load. Utilisation is calculated as you enter figures.',computed:'capacity',qs:[
  {id:'commissioned',label:'Year commissioned',type:'number',ph:'e.g. 2011'},
  {id:'designer',label:'Designer / contractor',type:'text'},
  {id:'technology',label:'Treatment stages present',type:'multi',options:['Screening','Equalisation','pH neutralisation','DAF','Primary clarifier','Anaerobic reactor','Activated sludge','SBR','MBBR','MBR','Secondary clarifier','Sand filtration','Disinfection','Lagoon / wetland']},
  {id:'design_flow',label:'Design flow',type:'number',unit:'m³/day'},
  {id:'actual_flow',label:'Current average flow',type:'number',unit:'m³/day'},
  {id:'peak_flow',label:'Peak flow',type:'number',unit:'m³/h'},
  {id:'flow_basis',label:'How is the current flow known?',type:'chips',options:['Flow meter','From water use','Operator estimate','Unknown']},
  {id:'design_cod',label:'Design COD load',type:'number',unit:'kg/day'},
  {id:'actual_cod',label:'Current COD load',type:'number',unit:'kg/day',hint:'Flow (m³/day) × influent COD (mg/L) ÷ 1000'},
  {id:'eq_volume',label:'Equalisation tank volume',type:'number',unit:'m³'},
  {id:'bio_volume',label:'Biological reactor volume',type:'number',unit:'m³'},
  {id:'op_hours',label:'Operating hours per day',type:'number',unit:'h'},
  {id:'bypass',label:'Is any treatment unit bypassed?',type:'chips',options:YN},
  {id:'docs',label:'Documents available',type:'multi',options:['Design report','As-built drawings','P&ID','O&M manual','Commissioning report']},
  {id:'upgrades',label:'Previous upgrades or modifications',type:'textarea'}]},
 {id:'daf',title:'Pre-treatment and DAF',intro:'Screens, equalisation, pH correction and the DAF unit.',qs:[
  {id:'screen',label:'Screening (type and bar spacing)',type:'text'},
  {id:'eq_mixing',label:'Is the equalisation tank mixed or aerated?',type:'chips',options:YN},
  {id:'ph_control',label:'pH control',type:'chips',options:['Automatic with probe','Manual dosing','None']},
  {id:'daf_present',label:'Is there a DAF unit?',type:'chips',options:YN},
  {id:'daf_running',label:'DAF operating status',type:'chips',options:['Continuous','Intermittent','Not running','N/A']},
  {id:'daf_capacity',label:'DAF design capacity',type:'number',unit:'m³/h'},
  {id:'daf_pressure',label:'Saturation pressure',type:'number',unit:'bar'},
  {id:'daf_recycle',label:'Recycle rate',type:'number',unit:'%'},
  {id:'daf_chem',label:'Chemicals dosed to the DAF',type:'multi',options:['Coagulant','Flocculant / polymer','pH adjustment','None']},
  {id:'daf_float',label:'Float removal',type:'chips',options:['Automatic scraper','Manual','Not removed regularly']},

/* ---------- saving ---------- */
function setStatus(){
  const el=$('#saveStatus');
  if(!S.db){el.className='status';el.textContent=!S.dbChecked?'Connecting…':(S.auth&&S.auth.state==='signedout'?'Signed out':'Not connected');return}
  if(S.canWrite===false){el.className='status';el.textContent='View only';return}
  if(S.outbox.length){el.className='status err';el.textContent=`${S.outbox.length} unsaved · Retry`;return}
  if(S.pending){el.className='status busy';el.textContent='Saving…';return}
  el.className='status ok';el.textContent='All changes saved';
}
async function runOp(o){
  const ref=S.db.doc(o.path);
  if(o.op==='set') return ref.set(o.data);
  if(o.op==='delete') return ref.delete();
  if(o.op==='merge'&&ref.merge) return ref.merge(o.data);
  if(o.op==='merge'){ // section answers: update if exists, otherwise create
    const snap=await ref.get();
    if(snap.exists) return ref.update(o.data);
    return ref.set(o.data);
  }
  if(o.op==='update') return ref.update(o.data);
}
async function write(o){
  if(!S.db){toast('Not signed in. Sign in to save.');return false}
  S.pending++;setStatus();
  try{
    try{await runOp(o)}
    catch(e){if(e&&e.code==='unavailable'){await sleep(700+Math.random()*900);await runOp(o)}else throw e}
    return true;
  }catch(e){
    const code=e&&e.code;
    if(code==='invalid_argument'&&S.canWrite!==true){S.canWrite=false;toast('You have view-only access to this audit.');render();return false}
    if(code==='quota_exceeded'){toast('The audit database is full. Delete unused entries and try again.');return false}
    if(code==='revoked'){toast('Access to this audit has changed. Reload the page.');return false}
    queue(o);return false;
  }finally{S.pending--;setStatus()}
}
function queue(o){
  // keep only the latest write per path+op for merges
  S.outbox=S.outbox.filter(x=>!(x.path===o.path&&x.op==='set'&&o.op==='set'));
  S.outbox.push(o);ls.set('ce-outbox',S.outbox);setStatus();
}
async function flush(){
  if(!S.db||!S.outbox.length)return;
  const items=S.outbox.splice(0);ls.set('ce-outbox',S.outbox);setStatus();
  for(const o of items)await write(o);
  if(!S.outbox.length)toast('Offline changes saved.');
}
window.addEventListener('online',flush);

/* ---------- capability start-up ---------- */
async function boot(){
  S.outbox=ls.get('ce-outbox',[]);
  S.view=ls.get('ce-view','overview');
  render();
  if(!window.CE){S.dbChecked=true;S.auth={state:'error',message:'The app files did not load completely. Reload the page.'};render();return}
  S.auth=await CE.init();S.dbChecked=true;
  if(S.auth.state!=='ready'){render();return}
  S.db=CE.db;S.user=CE.user;S.assets=CE.assets;S.downloads=CE.downloads;S.canWrite=null;
  try{S.uid=await CE.user.id()}catch(e){}
  const ab=$('#acctBtn');ab.hidden=false;ab.title='Signed in as '+(S.auth.name||S.auth.username||'')+'. Click to sign out.';
  S.db.collection('audits').onSnapshot(snap=>{
    S.audits=snap.docs.map(d=>({id:d.id,...d.data()}));S.auditsLoaded=true;
    if(!S.auditId||!S.audits.find(a=>a.id===S.auditId)){
      const saved=ls.get('ce-audit',null);
      const pick=S.audits.find(a=>a.id===saved)||S.audits.slice().sort((a,b)=>(b.visitDate||'').localeCompare(a.visitDate||''))[0];
      if(pick)selectAudit(pick.id);else render();
    }else{S.audit=S.audits.find(a=>a.id===S.auditId);renderHeader();if(S.view==='overview'||S.view==='audits')render()}
  },e=>toast('Could not load audits: '+((e&&e.message)||'unknown error')));
  setStatus();flush();
}

function selectAudit(id){
  S.unsubs.forEach(u=>u());S.unsubs=[];
  S.auditId=id;ls.set('ce-audit',id);S.audit=S.audits.find(a=>a.id===id)||null;
  S.sections={};REG_KEYS.forEach(k=>{S.regs[k]=[];S.regsLoaded[k]=false});
  if(S.view==='audits')S.view='overview';
  const base='audits/'+id;
  S.unsubs.push(S.db.collection(base+'/sections').onSnapshot(snap=>{
    snap.docs.forEach(d=>S.sections[d.id]=d.data());
    if(S.view==='questions'&&S.section){patchForm();renderQNav()}else if(S.view==='overview'||S.view==='questions')render();
  },()=>{}));
  REG_KEYS.forEach(k=>S.unsubs.push(S.db.collection(base+'/'+k).onSnapshot(snap=>{
    S.regs[k]=snap.docs.map(d=>({id:d.id,...d.data()}));S.regsLoaded[k]=true;
    renderTabs();if(S.view===k||S.view==='overview')render();
  },()=>{})));
  render();
}

function go(v,opts={}){S.view=v;if(v!=='audits')ls.set('ce-view',v);if(opts.section!==undefined)S.section=opts.section;render();window.scrollTo({top:0})}

function render(){
  renderHeader();renderTabs();setStatus();
  const m=$('#main');
  let banner='';
  const gate=S.dbChecked&&!S.db;$('#tabs').hidden=gate;$('#switchBtn').hidden=gate;
  if(gate){m.innerHTML=viewAuth();return}
  if(S.canWrite===false)banner=`<div class="banner info">You can view this audit but not edit it. Ask the app manager to check your account.</div>`;
  if(S.outbox.length)banner+=`<div class="banner">${S.outbox.length} change${S.outbox.length>1?'s are':' is'} stored on this device and not yet saved. They will be sent when the connection returns. <button class="btn ghost" type="button" data-act="flush">Retry now</button></div>`;
  if(S.view==='audits'){m.innerHTML=banner+viewAudits();return}
  if(!S.audit){m.innerHTML=banner+(S.auditsLoaded?`<div class="empty"><b>No audit yet</b>Create the first audit to start recording.<div style="margin-top:12px"><button class="btn primary" type="button" data-act="audits">Create an audit</button></div></div>`:`<div class="empty"><b>Loading audit data</b>Entries from the whole team appear here.</div>`);return}
  if(S.view==='overview')m.innerHTML=banner+viewOverview();
  else if(S.view==='questions'){m.innerHTML=banner+viewQuestions();bindForm()}
  else if(REGS[S.view])m.innerHTML=banner+viewRegister(S.view);
  const ids=[];REG_KEYS.forEach(k=>S.regs[k].forEach(r=>ids.push(r.by)));Object.values(S.sections).forEach(s=>ids.push(s.updatedBy));
  const missing=[...new Set(ids.filter(i=>i&&!(i in S.names)))];
  if(missing.length&&S.user){missing.forEach(i=>S.names[i]='');names(missing).then(()=>{if(REGS[S.view])render()})}
}

  <div class="grid2">

function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}catch(e){return d}}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='newAudit')return;e.preventDefault();
  const client=$('#na-client').value.trim();if(!client)return;
  const id=(client+'-'+($('#na-date').value||YEAR)).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)+'-'+Math.random().toString(36).slice(2,6);
  ls.set('ce-audit',id);
  const ok=await write({op:'set',path:'audits/'+id,data:{client,site:$('#na-site').value.trim(),visitDate:$('#na-date').value,status:'Planned',team:'',createdAt:Date.now(),by:S.uid||null}});
  if(ok){S.view='overview';if(S.audits.find(a=>a.id===id))selectAudit(id);else{S.auditId=null;render()}toast('Audit created.')}

/* ---------- overview ---------- */
function flags(){
  const F=[];const A=(s,q)=>ans(s,q);
  const df=num(A('wwtp','design_flow')),af=num(A('wwtp','actual_flow')),dc=num(A('wwtp','design_cod')),ac=num(A('wwtp','actual_cod'));
  if(df&&af){const u=af/df*100;if(u>100)F.push(['bad',`WWTP hydraulically overloaded: current flow is ${Math.round(u)}% of design.`]);else if(u>85)F.push(['warn',`WWTP running at ${Math.round(u)}% of design flow; little spare capacity.`])}
  if(dc&&ac){const u=ac/dc*100;if(u>100)F.push(['bad',`Organic overload: COD load is ${Math.round(u)}% of design.`]);else if(u>85)F.push(['warn',`COD load at ${Math.round(u)}% of design.`])}
  const yr=num(A('wwtp','commissioned'));if(yr&&YEAR-yr>=15)F.push(['warn',`WWTP is ${YEAR-yr} years old (commissioned ${yr}).`]);
  const fail=A('compliance','failing');if(Array.isArray(fail)&&fail.length)F.push(['bad',`Failing parameters: ${fail.join(', ')}.`]);
  const yes=(s,q,msg,sev='warn')=>{if(A(s,q)==='Yes')F.push([sev,msg])};
  const no=(s,q,msg,sev='warn')=>{if(A(s,q)==='No')F.push([sev,msg])};
  yes('wwtp','bypass','Treatment units are being bypassed.','bad');
  yes('production','domestic','Domestic sewage is mixed with process effluent.');
  yes('production','storm','Stormwater enters the effluent drains.');
  no('production','segregation','High-strength streams are not segregated.');
  if(['Sometimes','Often'].includes(A('production','losses')))F.push(['warn',`Product losses go to drain (${A('production','losses').toLowerCase()}).`]);
  if(A('production','grease_traps')&&A('production','grease_traps')!=='Present, maintained')F.push(['warn',`Grease traps: ${A('production','grease_traps').toLowerCase()}.`]);
  if(A('cip','cip_dump')==='Dumped in one go')F.push(['bad','Spent CIP solutions are dumped in one go, causing pH and load shocks.']);
  no('cip','cip_recovery','CIP caustic and acid are not recovered.');
  if(['Not running','Intermittent'].includes(A('daf','daf_running')))F.push(['bad',`DAF is ${A('daf','daf_running').toLowerCase()}.`]);
  if(A('daf','daf_float')==='Not removed regularly')F.push(['warn','DAF float is not removed regularly.']);
  if(A('daf','ph_control')==='None')F.push(['warn','No pH control ahead of treatment.']);
  yes('bio','bulking','Bulking or rising sludge in the clarifier.','bad');
  no('bio','ras','Return sludge pumping is not working.','bad');
  const dox=num(A('bio','do_reading'));if(dox!==null&&dox<1.5)F.push(['bad',`Low dissolved oxygen in the reactor (${dox} mg/L).`]);
  no('dosing','jar_tests','Dosing is not optimised with jar tests.');
  no('dosing','sds','Safety data sheets are missing for some chemicals.');
  if(A('dosing','chem_store')==='Poor')F.push(['warn','Chemical store is in poor condition.']);
  no('om','sops','No written operating procedures.');no('om','logbook','No daily operating logs.');
  if(A('om','maint')==='Breakdown only')F.push(['warn','Maintenance is breakdown-only.']);
  yes('om','outages','The plant stops during power outages.');
  if(['Part-time','None'].includes(A('om','operator_cover')))F.push(['warn',`Operator cover: ${A('om','operator_cover').toLowerCase()}.`]);
  if(A('sludge','disposal')==='Stored on site'||A('sludge','disposal')==='Unknown')F.push(['warn',`Sludge disposal route: ${A('sludge','disposal').toLowerCase()}.`]);
  const eq=S.regs.equipment;
  const bad=eq.filter(e=>e.condition==='Not working'||e.status==='Out of service');if(bad.length)F.push(['bad',`${bad.length} equipment item${bad.length>1?'s':''} not working or out of service: ${bad.slice(0,4).map(e=>e.name||e.category).join(', ')}${bad.length>4?'…':''}.`]);
  const poor=eq.filter(e=>e.condition==='Poor');if(poor.length)F.push(['warn',`${poor.length} equipment item${poor.length>1?'s':''} in poor condition.`]);
  const old=eq.filter(e=>num(e.year)&&YEAR-num(e.year)>=15);if(old.length)F.push(['warn',`${old.length} equipment item${old.length>1?'s are':' is'} 15 years old or more.`]);
  const nosds=S.regs.chemicals.filter(c=>c.sds==='No');if(nosds.length)F.push(['warn',`No SDS for: ${nosds.map(c=>c.name||c.trade).join(', ')}.`]);
  S.regs.measurements.forEach(m=>{const p=num(m.ph),t=num(m.temp);const loc=m.location||'a sampling point';
    if(p!==null&&(p<6||p>9))F.push(['bad',`pH ${p} at ${loc.toLowerCase()}${m.time?' ('+m.time+')':''}.`]);
    if(t!==null&&t>35)F.push(['warn',`Temperature ${t} °C at ${loc.toLowerCase()}.`])});
  S.regs.observations.filter(o=>o.severity==='Critical').forEach(o=>F.push(['bad',o.title||'Critical observation']));
  return F.sort((a,b)=>(a[0]==='bad'?0:1)-(b[0]==='bad'?0:1));
}
function viewOverview(){
  const a=S.audit;
  const totals=SECTIONS.reduce((acc,s)=>{const p=secProgress(s);acc.n+=p.n;acc.t+=p.t;return acc},{n:0,t:0});
  const pct=totals.t?Math.round(totals.n/totals.t*100):0;
  const eq=S.regs.equipment;const cond={Good:0,Fair:0,Poor:0,'Not working':0,'Not rated':0};
  eq.forEach(e=>cond[e.condition&&cond[e.condition]!==undefined?e.condition:'Not rated']++);
  const colors={Good:'var(--good)',Fair:'var(--accent)',Poor:'var(--warn)','Not working':'var(--bad)','Not rated':'var(--line)'};
  const ages=eq.map(e=>num(e.year)).filter(Boolean).map(y=>YEAR-y);const avgAge=ages.length?Math.round(ages.reduce((x,y)=>x+y,0)/ages.length):null;
  const F=flags();
  const ro=readOnly();
  const vf=(id,label,type='text',ph='')=>`<div class="f"><label class="ql" for="au-${id}">${label}</label>${type==='textarea'?`<textarea class="inp" id="au-${id}" data-audit="${id}" ${ro?'disabled':''} placeholder="${esc(ph)}">${esc(a[id]||'')}</textarea>`:`<input class="inp" id="au-${id}" data-audit="${id}" type="${type}" value="${esc(a[id]||'')}" ${ro?'disabled':''} placeholder="${esc(ph)}">`}</div>`;
  return `
  <div class="sechead"><div><span class="eyebrow">${a.visitDate?esc(fmtDate(a.visitDate)):'Visit date not set'}</span><h2>${esc(a.client||'Untitled audit')}</h2></div>
    </div>
  <div class="stats" style="margin-bottom:16px">
    <div class="stat"><b>${pct}%</b><span>Questionnaire answered (${totals.n} of ${totals.t})</span></div>
    <div class="stat"><b>${eq.length}</b><span>Equipment items recorded</span></div>
    <div class="stat"><b>${S.regs.chemicals.length}</b><span>Chemicals recorded</span></div>
    <div class="stat"><b>${avgAge===null?'–':avgAge+' yr'}</b><span>Average equipment age</span></div>
    <div class="stat"><b>${F.filter(f=>f[0]==='bad').length}</b><span>Critical findings so far</span></div>
  </div>
  <div class="grid2">
   <div class="stack">
    <section class="card"><div class="cardtitle">Findings so far</div>
     ${F.length?`<ul class="flags">${F.map(([s,t])=>`<li><span class="sev ${s}">${s==='bad'?'Critical':'Concern'}</span><span>${esc(t)}</span></li>`).join('')}</ul>`:`<p class="muted" style="margin:0">Findings appear here automatically as answers, equipment conditions and field readings are entered.</p>`}
    </section>
    ${S.downloads?`<section class="card"><div class="cardtitle">Export to SharePoint</div><p class="muted" style="margin:0 0 10px">One Excel workbook with a named table for each dataset. Save it into the synced SharePoint <b>Incoming</b> folder and Power Automate posts it to Teams.</p><div class="row"><button class="btn primary" type="button" data-act="export-xlsx">Download workbook (.xlsx)</button></div><details style="margin-top:12px"><summary class="muted" style="cursor:pointer">Other formats</summary><div class="row" style="margin-top:10px"><button class="btn" type="button" data-act="export-q">Questionnaire (CSV)</button>${REG_KEYS.map(k=>`<button class="btn" type="button" data-act="export-csv" data-k="${k}">${REGS[k].label} (CSV)</button>`).join('')}<button class="btn" type="button" data-act="export-json">Everything (JSON)</button></div></details></section>`:''}
    <section class="card"><div class="cardtitle">Equipment condition</div>
     ${eq.length?`<div class="cbar">${Object.entries(cond).filter(([,v])=>v).map(([k,v])=>`<i style="width:${v/eq.length*100}%;background:${colors[k]}" title="${k}: ${v}"></i>`).join('')}</div>
     <div class="legend">${Object.entries(cond).filter(([,v])=>v).map(([k,v])=>`<span style="--c:${colors[k]}">${k} <b class="mono">${v}</b></span>`).join('')}</div>`:`<p class="muted" style="margin:0">No equipment recorded yet. <button class="btn ghost" type="button" data-view-go="equipment">Add the first item</button></p>`}
    </section>
   </div>
   <div class="stack">
    <section class="card"><div class="cardtitle">Questionnaire progress</div>
     <div class="prog">${SECTIONS.map(s=>{const p=secProgress(s);return `<button type="button" data-sec="${s.id}"><span>${esc(s.title)}</span><span class="frac">${p.n}/${p.t}</span><span class="meter"><i class="${p.n===p.t?'full':''}" style="width:${p.t?p.n/p.t*100:0}%"></i></span></button>`}).join('')}</div>

/* ---------- questionnaire ---------- */
function viewQuestions(){
  const open=!!S.section;
  return `<div class="qlayout ${open?'open':''}">
   <aside class="qnav card"><div class="cardtitle">Sections</div><div class="prog" id="qnav"></div></aside>
   <section class="qform card" id="qform">${open?formHTML(SECTIONS.find(s=>s.id===S.section)):''}</section>
  </div>`;
}
function renderQNav(){
  const el=$('#qnav');if(!el)return;
  el.innerHTML=SECTIONS.map(s=>{const p=secProgress(s);return `<button type="button" data-sec="${s.id}" ${S.section===s.id?'aria-current="true"':''}><span>${esc(s.title)}</span><span class="frac">${p.n}/${p.t}</span><span class="meter"><i class="${p.n===p.t?'full':''}" style="width:${p.t?p.n/p.t*100:0}%"></i></span></button>`}).join('');
}
function qInput(q,val,ctx){
  const ro=readOnly();const id=`${ctx}-${q.id}`;const dis=ro?'disabled':'';
  if(q.type==='textarea')return `<textarea class="inp" id="${id}" data-q="${q.id}" ${dis}>${esc(val||'')}</textarea>`;
  if(q.type==='code')return `<div class="codebox"><span class="mono" id="codeVal">${esc(val||'Assigned when you pick a sampling point')}</span><button class="btn" type="button" data-act="copy-code">Copy</button></div>`;
  if(q.type==='text'||q.type==='time'||q.type==='date')return `<input class="inp ${q.mono?'mono':''}" id="${id}" type="${q.type}" data-q="${q.id}" value="${esc(val||'')}" placeholder="${esc(q.ph||'')}" ${dis}>`;
  if(q.type==='number'){
    const unit=q.unitField?`<select class="unit" data-q="${q.unitField}" aria-label="Unit" ${dis}>${q.units.map(u=>`<option ${ctx==='r'&&S.sheet&&S.sheet.data[q.unitField]===u?'selected':''}>${esc(u)}</option>`).join('')}</select>`:(q.unit?`<span class="unit">${esc(q.unit)}</span>`:'');
    return `<div class="numwrap"><input class="inp" id="${id}" type="text" inputmode="decimal" data-q="${q.id}" value="${esc(val??'')}" placeholder="${esc(q.ph||'')}" ${dis} style="${unit?'':'border-radius:8px'}">${unit}</div>`;
  }
  if(q.type==='select')return `<select class="inp" id="${id}" data-q="${q.id}" ${dis}><option value="">Select…</option>${q.options.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if(q.type==='chips'||q.type==='rating'){
    const opts=q.type==='rating'?['1','2','3','4','5']:q.options;
    return `<div class="chips ${q.type==='rating'?'rating':''}" id="${id}" data-q="${q.id}" data-kind="single" role="group">${opts.map(o=>`<button type="button" data-v="${esc(o)}" aria-pressed="${String(val)===o}" ${dis}>${esc(o)}</button>`).join('')}</div>`;
  }
  if(q.type==='multi'){const arr=Array.isArray(val)?val:[];
    return `<div class="chips" id="${id}" data-q="${q.id}" data-kind="multi" role="group">${q.options.map(o=>`<button type="button" data-v="${esc(o)}" aria-pressed="${arr.includes(o)}" ${dis}>${esc(o)}</button>`).join('')}</div>`;}
  if(q.type==='photos')return `<div class="photos" id="${id}" data-photos="${q.id}"></div>`;
  return '';
}
function formHTML(s){
  const i=SECTIONS.indexOf(s);const a=answers(s.id);const meta=S.sections[s.id];
  return `<button class="btn ghost" type="button" data-act="back-sections" style="margin-left:-8px">← All sections</button>
  <span class="eyebrow">Section ${i+1} of ${SECTIONS.length}</span><h2>${esc(s.title)}</h2>
  <p class="intro">${esc(s.intro||'')}${meta&&meta.updatedAt?` <span class="muted">Last edited ${when(meta.updatedAt)} by ${esc(who(meta.updatedBy))}.</span>`:''}</p>
  ${s.computed?'<div id="computed"></div>':''}
  <div id="qs">${s.qs.map(q=>`<div class="q"><label class="ql" for="q-${q.id}">${esc(q.label)}</label>${q.hint?`<span class="hint">${esc(q.hint)}</span>`:''}${qInput(q,a[q.id],'q')}</div>`).join('')}</div>
  <div class="qfoot">${i>0?`<button class="btn" type="button" data-sec="${SECTIONS[i-1].id}">← ${esc(SECTIONS[i-1].title)}</button>`:'<span></span>'}${i<SECTIONS.length-1?`<button class="btn primary" type="button" data-sec="${SECTIONS[i+1].id}">${esc(SECTIONS[i+1].title)} →</button>`:`<button class="btn primary" type="button" data-act="to-overview">Back to overview</button>`}</div>`;
}
function renderComputed(){
  const el=$('#computed');if(!el)return;
  const df=num(ans('wwtp','design_flow')),af=num(ans('wwtp','actual_flow')),dc=num(ans('wwtp','design_cod')),ac=num(ans('wwtp','actual_cod')),yr=num(ans('wwtp','commissioned')),bv=num(ans('wwtp','bio_volume'));
  const pct=(x,y)=>x&&y?Math.round(x/y*100)+'%':'–';
  const hrt=bv&&af?(bv/af*24).toFixed(1)+' h':'–';
  el.innerHTML=`<div class="computed"><div><b>${pct(af,df)}</b><span>Hydraulic loading (flow ÷ design)</span></div><div><b>${pct(ac,dc)}</b><span>Organic loading (COD ÷ design)</span></div><div><b>${hrt}</b><span>Biological HRT at current flow</span></div><div><b>${yr?YEAR-yr+' yr':'–'}</b><span>Plant age</span></div></div>`;
}
function bindForm(){renderQNav();renderComputed()}
function patchForm(){
  const s=SECTIONS.find(x=>x.id===S.section);if(!s)return;const a=answers(s.id);
  s.qs.forEach(q=>{
    const el=document.querySelector(`#qs [data-q="${q.id}"]`);if(!el||el.contains(document.activeElement)||S.timers['q:'+q.id])return;
    if(el.dataset.kind==='single')el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(a[q.id])===b.dataset.v));
    else if(el.dataset.kind==='multi'){const arr=Array.isArray(a[q.id])?a[q.id]:[];el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',arr.includes(b.dataset.v)))}
    else if(el.value!==String(a[q.id]??''))el.value=a[q.id]??'';
  });
  renderComputed();
}
function saveAnswer(qid,val){
  if(readOnly())return;
  const sid=S.section;const now=Date.now();
  // local echo
  S.sections[sid]=S.sections[sid]||{answers:{}};S.sections[sid].answers={...answers(sid),[qid]:val};
  renderQNav();renderComputed();
  write({op:'merge',path:`audits/${S.auditId}/sections/${sid}`,data:{answers:{[qid]:val},updatedAt:now,updatedBy:S.uid||null}});
}

/* ---------- registers ---------- */
function summary(k,r){
  const pills=[];let t='',m='';
  if(k==='equipment'){t=r.name||r.category||'Unnamed item';m=[r.tag&&`<span class="mono">${esc(r.tag)}</span>`,esc(r.category&&r.name?r.category:''),esc([r.brand,r.model].filter(Boolean).join(' ')),esc(r.area||'')].filter(Boolean).join(' · ');
    const c={Good:'good',Fair:'info',Poor:'warn','Not working':'bad'}[r.condition];if(r.condition)pills.push(`<span class="pill ${c}">${esc(r.condition)}</span>`);
    if(r.status&&r.status!=='In service')pills.push(`<span class="pill ${r.status==='Out of service'?'bad':''}">${esc(r.status)}</span>`);
    if(num(r.year))pills.push(`<span class="pill">${YEAR-num(r.year)} yr old</span>`);
    if(num(r.cap))pills.push(`<span class="pill mono">${esc(r.cap)} ${esc(r.cap_unit||'')}</span>`)}
  if(k==='chemicals'){t=r.name||r.trade||'Unnamed chemical';m=[esc(r.trade&&r.name?r.trade:''),esc(r.purpose||''),esc(r.used_in||''),esc(r.supplier||'')].filter(Boolean).join(' · ');
    if(num(r.monthly))pills.push(`<span class="pill mono">${esc(r.monthly)} ${esc(r.monthly_unit||'')}/month</span>`);
    if(r.sds)pills.push(`<span class="pill ${r.sds==='Yes'?'good':r.sds==='No'?'bad':''}">SDS: ${esc(r.sds)}</span>`)}
  if(k==='products'){t=r.name||r.type||'Unnamed line';m=[esc(r.type||''),esc(r.packaging||'')].filter(Boolean).join(' · ');
    if(num(r.cap))pills.push(`<span class="pill mono">${esc(r.cap)} ${esc(r.cap_unit||'')}</span>`);if(num(r.cip))pills.push(`<span class="pill">${esc(r.cip)} CIP/day</span>`)}
  if(k==='measurements'){t=r.location||'Reading';m=[esc(r.location_detail||''),esc(r.time||'')].filter(Boolean).join(' · ');
    const p=num(r.ph);if(p!==null)pills.push(`<span class="pill mono ${p<6||p>9?'bad':''}">pH ${p}</span>`);

async function compress(file){
  try{const bmp=await createImageBitmap(file);const max=1600,s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82))}catch(e){return file}
}
async function upload(fid,files){
  const sh=S.sheet;if(!sh||!S.assets)return;sh.uploading=true;renderSheetPhotos();
  for(const f of files){
    try{const blob=await compress(f);const res=await S.assets.upload(blob,{type:blob.type&&blob.type.startsWith('image/')?blob.type:'image/jpeg'});
      sh.data[fid]=[...(sh.data[fid]||[]),res.id];sh.dirty=true;}
    catch(e){const c=e&&e.code;toast(c==='too_large'?'That photo is too large.':c==='unsupported_type'?'That file type is not supported. Use JPG or PNG.':c==='quota_or_state'?'Photo storage is full.':c==='rate_limited'?'Too many uploads at once. Wait a moment.':'Photo upload failed. Try again.');if(c==='store_unavailable'||!c)continue;break}
  }
  sh.uploading=false;renderSheetPhotos();
}

function nextCode(point,date,extra=[]){
  const d=(date||(S.audit&&S.audit.visitDate)||new Date().toISOString().slice(0,10)).replace(/-/g,'').slice(2,8);

async function exportXLSX(mode){
  toast(mode==='sp'?'Preparing workbook for SharePoint…':'Preparing workbook…');
  try{await loadScript('vendor/exceljs.min.js')}catch(e){toast('Could not load the Excel tools. Check the connection and try again.');return}
  const wb=new ExcelJS.Workbook();wb.creator='Cleanearth site audit';wb.created=new Date();
  const F=flags();
  const add=(sheet,table,headers,rows)=>{
    const ws=wb.addWorksheet(sheet);
    const uniq=[];headers.forEach(h=>{let n=h,i=2;while(uniq.includes(n))n=h+' '+(i++);uniq.push(n)});
    ws.addTable({name:table,ref:'A1',headerRow:true,style:{theme:'TableStyleMedium2',showRowStripes:true},columns:uniq.map(n=>({name:n,filterButton:true})),rows:rows.length?rows:[uniq.map(()=>'')]});
    ws.columns.forEach((c,i)=>{const w=Math.max(String(uniq[i]).length,...rows.slice(0,200).map(r=>String(r[i]??'').length));c.width=Math.min(60,Math.max(10,w+2))});
    ws.views=[{state:'frozen',ySplit:1}];
  };
  const a=S.audit;const tot=SECTIONS.reduce((x,s)=>{const p=secProgress(s);x.n+=p.n;x.t+=p.t;return x},{n:0,t:0});
  add('Summary','Summary',['Client','Site','Visit date','Industry','Cleanearth team','Status','Questions answered','Questions total','Equipment items','Chemicals','Product lines','Field readings','Samples','Observations','Critical findings','Concerns','Exported at','Audit ID'],
    [[a.client||'',a.site||'',a.visitDate||'',a.sector||'',a.team||'',a.status||'',tot.n,tot.t,S.regs.equipment.length,S.regs.chemicals.length,S.regs.products.length,S.regs.measurements.length,S.regs.samples.length,S.regs.observations.length,F.filter(f=>f[0]==='bad').length,F.filter(f=>f[0]!=='bad').length,new Date().toISOString().slice(0,16).replace('T',' '),S.auditId]]);
  add('Findings','Findings',['Client','Site','Visit date','Severity','Finding'],F.map(([sv,t])=>[...auditCols(),sv==='bad'?'Critical':'Concern',t]));
  const qrows=[];SECTIONS.forEach(s=>s.qs.forEach(q=>{let v=ans(s.id,q.id);if(Array.isArray(v))v=v.join('; ');if(q.type==='number'&&num(v)!==null)v=num(v);qrows.push([...auditCols(),s.title,s.id+'.'+q.id,q.label,q.unit||'',v??''])}));
  add('Questionnaire','Questionnaire',['Client','Site','Visit date','Section','Question ID','Question','Unit','Answer'],qrows);
  const names={equipment:['Equipment','Equipment'],chemicals:['Chemicals','Chemicals'],products:['Product lines','ProductLines'],measurements:['Field readings','FieldReadings'],samples:['Samples','Samples'],observations:['Observations','Observations']};
  REG_KEYS.forEach(k=>{const {headers,rows}=regRows(k);const [sh,tb]=names[k]||[REGS[k].label,k];add(sh,tb,headers,rows)});
  const buf=await wb.xlsx.writeBuffer();
  const d=(a.visitDate||new Date().toISOString().slice(0,10));
  const name=`CE_Audit_${slug()}_${d}.xlsx`;const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  if(mode!=='sp'){save(name,blob);return}
  try{const r=await CE.uploadReport(name,blob);S.lastSent={name:r.name,url:r.webUrl,at:Date.now()};toast(`Sent to SharePoint as ${r.name}.`);if(S.view==='overview')render()}
  catch(e){toast(e&&e.code==='unavailable'?'No connection. Send to SharePoint again when you have signal.':'Could not save to SharePoint: '+((e&&e.message)||'unknown error'))}
}
function exportQ(){
  const lines=[['Client','Site','Visit date','Section','Question ID','Question','Answer'].map(cell).join(',')];
  SECTIONS.forEach(s=>s.qs.forEach(q=>{const v=ans(s.id,q.id);lines.push([...auditCols(),s.title,s.id+'.'+q.id,q.label+(q.unit?` (${q.unit})`:''),v??''].map(cell).join(','))}));
  save(`${slug()}_questionnaire.csv`,'﻿'+lines.join('\r\n'));
}

/* ---------- photos from SharePoint ---------- */
function hydratePhotos(root){
  (root||document).querySelectorAll('img[data-photo]:not([data-loaded])').forEach(img=>{
    img.setAttribute('data-loaded','1');
    if(!window.CE||!S.db)return;
    CE.photoURL(img.dataset.photo).then(u=>{img.src=u}).catch(()=>{img.alt='Photo unavailable offline'});
  });
}
new MutationObserver(()=>hydratePhotos()).observe(document.body,{childList:true,subtree:true});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

boot();
</script>
