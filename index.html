<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cleanearth Site Audit</title>
<meta name="theme-color" content="#0A6A75">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header + scrolling tab strip; one working column on phones, list + detail on wide screens */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --sunken:#F5F8F9; --ink:#10252D; --muted:#566C74; --line:#D3DEE1;
  --accent:#0A6A75; --accent-ink:#FFFFFF; --accent-soft:#DCEEF0;
  --good:#23704A; --good-soft:#DFF1E6; --warn:#9A5B0B; --warn-soft:#FBEBD2; --bad:#B42318; --bad-soft:#FBE1DE;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1518; --surface:#122127; --sunken:#0E1B20; --ink:#E2EDEF; --muted:#90A6AD; --line:#24373E;
  --accent:#4DB6C1; --accent-ink:#06171A; --accent-soft:#143840;
  --good:#5EC58E; --good-soft:#143323; --warn:#E6AB4C; --warn-soft:#3A2A10; --bad:#F2766A; --bad-soft:#3D1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1518; --surface:#122127; --sunken:#0E1B20; --ink:#E2EDEF; --muted:#90A6AD; --line:#24373E;
  --accent:#4DB6C1; --accent-ink:#06171A; --accent-soft:#143840;
  --good:#5EC58E; --good-soft:#143323; --warn:#E6AB4C; --warn-soft:#3A2A10; --bad:#F2766A; --bad-soft:#3D1A17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.mono{font-family:var(--font-mono);font-size:.92em}
.muted{color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.auditname{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sunken);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.ok{color:var(--good);background:var(--good-soft);border-color:transparent}
.status.busy{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.status.err{color:var(--bad);background:var(--bad-soft);border-color:transparent;cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs.sub{border-top:1px solid var(--line)}
nav.tabs.sub button{font-size:14px;padding:8px 12px}
nav.tabs .pnum{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--sunken);font-size:11px;font-family:var(--font-mono);margin-right:6px;color:var(--muted)}
nav.tabs button[aria-current="page"] .pnum{background:var(--accent);color:var(--accent-ink)}
nav.tabs .count{font-family:var(--font-mono);font-size:11px;margin-left:5px;color:var(--muted)}

main{padding-block:20px 80px}
.banner{margin-bottom:16px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px}
.banner.info{background:var(--accent-soft);color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:500;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sechead h2{font-size:20px}
.cardtitle{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:13px;color:var(--muted)}

/* progress list */
.prog{display:flex;flex-direction:column}
.prog button{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer}
.prog button:first-child{border-top:0}
.meter{grid-column:1/-1;height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.full{background:var(--good)}
.frac{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* flags */
.flags{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.flags li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--sunken)}
.sev{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.sev.bad,.pill.bad{background:var(--bad-soft);color:var(--bad)}
.sev.warn,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.sev.good,.pill.good{background:var(--good-soft);color:var(--good)}
.sev.info,.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}

/* condition bars */
.cbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunken);margin:6px 0 10px}
.cbar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}

/* questionnaire */
.qlayout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.qnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px)}
@media (max-width:820px){.qlayout{grid-template-columns:minmax(0,1fr)}.qnav{position:static}.qlayout.open .qnav{display:none}.qlayout:not(.open) .qform{display:none}}
.qnav .prog button[aria-current="true"]{background:var(--accent-soft);border-radius:6px;padding-inline:8px}
.qform h2{font-size:22px;margin-bottom:4px}
.intro{color:var(--muted);margin:0 0 18px;max-width:65ch}
.q{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.q label.ql,.f label.ql{font-weight:500}
.q .hint,.f .hint{font-size:13px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:9px 11px;min-height:40px}
.inp:focus{border-color:var(--accent);background:var(--surface);outline:none}
textarea.inp{min-height:80px;resize:vertical}
.numwrap{display:flex;align-items:stretch;max-width:340px}
.numwrap .inp{border-top-right-radius:0;border-bottom-right-radius:0;font-variant-numeric:tabular-nums}
.numwrap .unit{display:flex;align-items:center;padding:0 10px;border:1px solid var(--line);border-left:0;border-radius:0 8px 8px 0;background:var(--surface);font-family:var(--font-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.numwrap select.unit{appearance:auto;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.rating button{min-width:42px;font-family:var(--font-mono)}
.computed{margin:6px 0 4px;padding:14px;border-radius:8px;background:var(--accent-soft);display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.computed div b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.computed div span{font-size:12px;color:var(--muted)}
.qfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* registers */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .inp{width:auto;flex:1 1 180px;min-height:38px}
.toolbar select.inp{flex:0 1 200px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .p{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.thumbs{display:flex;gap:6px;margin-top:4px}
.thumbs img{width:48px;height:48px;object-fit:cover;border-radius:6px;background:var(--sunken)}
.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* editor sheet */
.scrim{position:fixed;inset:0;background:rgba(6,20,24,.45);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(620px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;border-bottom:1px solid var(--line)}
.sheet header h3{font-size:18px}
.sheet .body{flex:1;overflow-y:auto;padding-block:8px 24px}
.sheet footer{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.f{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.f:first-child{border-top:0}
.fpair{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.photo{position:relative;width:96px;height:96px}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:8px;background:var(--sunken)}
.photo button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.addphoto{width:96px;height:96px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px;color:var(--muted);cursor:pointer;text-align:center;padding:6px}
.addphoto:hover{border-color:var(--accent);color:var(--accent)}
.addphoto.cam{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:500;gap:4px}
.codebox{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;background:var(--accent-soft)}
.codebox span{font-size:28px;letter-spacing:.02em;font-weight:500;overflow-wrap:anywhere}
.item .t.code{font-family:var(--font-mono);font-size:17px;font-weight:500}
.btn.small{min-height:30px;padding:4px 10px;font-size:13px}
/* phase tracker */
.phases{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.ph{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:8px;background:var(--sunken);border:1px solid transparent;min-width:0}
.ph.current{border-color:var(--accent);background:var(--accent-soft)}
.phbtn{display:flex;gap:10px;align-items:flex-start;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.pdot{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-family:var(--font-mono);font-size:12px;font-weight:600}
.ph.current .pdot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ph.done .pdot{background:var(--good);border-color:var(--good);color:#fff}
.pt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pt b{font-size:14px}.pt .muted{font-size:12px}
.ph .meter{margin-top:4px}
.ph>.btn,.ph>.pill{align-self:flex-start}
/* checklist */
.tasks{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.task{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.tick{flex:none;width:26px;height:26px;border-radius:6px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:none;border:0;padding:2px 0;text-align:left;cursor:pointer}
.tt{overflow-wrap:anywhere}
.tbody .m{font-size:13px;color:var(--muted)}
.task.done .tt,.task.skip .tt{color:var(--muted);text-decoration:line-through}
.late{color:var(--bad);font-weight:500}
.tbl.limits .inp{min-height:34px;padding:6px 8px;max-width:130px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* audits list */
.audits{display:flex;flex-direction:column;gap:10px}
.audits button.item{flex-direction:row;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;overflow-wrap:anywhere}
@media (max-width:520px){.card{padding:14px}.bar{gap:8px}.status{font-size:11px;padding:3px 8px}#switchBtn{padding:6px 10px;min-height:34px}main{padding-block:14px 60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap gut">
    <div class="bar">
      <div class="brand">
        <span class="eyebrow">Cleanearth site audit</span>
        <span class="auditname" id="auditName">Loading audit…</span>
      </div>
      <span class="status" id="saveStatus">Connecting…</span>
      <button class="btn" id="switchBtn" type="button">All projects</button>
      <button class="btn ghost" id="acctBtn" type="button" data-act="signout" hidden>Sign out</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Phases"></nav>
    <nav class="tabs sub" id="subtabs" aria-label="Sections" hidden></nav>
  </div>
</header>

<main class="wrap gut" id="main"></main>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="ce-backend.js"></script>
<script>
/* ---------- schema ---------- */
const AREAS=['Water intake & storage','Water treatment','Production','CIP','Effluent collection','Screening & equalisation','DAF / primary','Biological','Clarification','Tertiary / disinfection','Sludge','Chemical store & dosing','Utilities','Outlet / discharge'];
const EQUIP_CATS=['Pump','Blower / aerator','DAF unit','Dosing pump / skid','Chemical tank','Process tank / basin','Clarifier / settler','Screen','Mixer / agitator','Sludge dewatering','Filter','Reverse osmosis','Softener','UV / disinfection','CIP unit','Heat exchanger','Instrument / meter','Control panel / PLC','Generator / electrical','Pipework / valve','Other'];
const YN=['Yes','No','Unknown'];
const POINTS=[['Raw water','RW'],['Treated water','TW'],['Production drain','PD'],['CIP discharge','CIP'],['WWTP inlet','IN'],['After equalisation','EQ'],['After DAF','DAF'],['Biological reactor','BR'],['Clarifier outlet','CO'],['Final outlet','FO'],['Receiving water','RCV'],['Other','OT']];
const POINT_NAMES=POINTS.map(p=>p[0]);const POINT_CODE=Object.fromEntries(POINTS);
const PARAMS=[{id:'ph',label:'pH',unit:''},{id:'temp',label:'Temperature',unit:'°C'},{id:'bod',label:'BOD',unit:'mg/L'},{id:'cod',label:'COD',unit:'mg/L'},{id:'tss',label:'TSS',unit:'mg/L'},{id:'tds',label:'TDS',unit:'mg/L'},{id:'fog',label:'FOG',unit:'mg/L'},{id:'turb',label:'Turbidity',unit:'NTU'},{id:'colour',label:'Colour',unit:'TCU'},{id:'nh3',label:'Ammonia',unit:'mg/L N'},{id:'no3',label:'Nitrate',unit:'mg/L N'},{id:'tn',label:'Total nitrogen',unit:'mg/L'},{id:'tp',label:'Total phosphorus',unit:'mg/L'},{id:'fc',label:'Faecal coliforms',unit:'CFU/100 mL'},{id:'ecoli',label:'E. coli',unit:'CFU/100 mL'},{id:'ec',label:'Conductivity',unit:'µS/cm'}];
const PHASES=[
 {id:'pre',label:'Pre-audit visit',short:'Pre-audit',intro:'Scoping visit: understand the site, find likely causes of non-compliance and gather what is needed to cost the audit.',views:[['questions','Questionnaire'],['equipment'],['chemicals'],['products'],['measurements'],['observations'],['tasks','Checklist']]},
 {id:'proposal',label:'Proposal',short:'Proposal',intro:'Scope and price the full audit, then win the client’s approval.',views:[['tasks','Checklist'],['costing']]},
 {id:'audit',label:'Full audit',short:'Full audit',intro:'Measure flows and loads, sample every stage, test the process and find the root causes.',views:[['tasks','Checklist'],['samples'],['results'],['flows'],['analysis','Analysis']]},
 {id:'remediation',label:'Remediation and retrofit',short:'Remediation',intro:'Choose, design and deliver the fixes, from quick operational wins to new treatment units.',views:[['tasks','Checklist'],['options'],['costing']]},
 {id:'monitoring',label:'Monitoring and aftercare',short:'Monitoring',intro:'Prove the fixes work and keep the plant compliant.',views:[['tasks','Checklist'],['results'],['measurements'],['samples']]}];
const TEMPLATES={
 pre:['Confirm visit date, attendees and client contacts','Send the information request list to the client','Review documents received (permit, past results, drawings, O&M manual)','Walk the site from water intake to final discharge','Complete every questionnaire section','Record all equipment with nameplate photos','Record all chemicals, doses and storage','Take spot readings (pH, temperature, DO, conductivity)','Close-out meeting: agree next steps and outstanding data','Export the workbook to SharePoint'],
 proposal:['Define audit scope and sampling points','Agree monitoring duration (normally 5–7 days, including CIP and a weekend)','Set the parameter list for each sampling point','Get a quotation from an accredited laboratory','Confirm flow metering (existing meters or hired meters)','Estimate staff days, transport and equipment hire','Complete the costing table','Internal review of scope and price','Submit the proposal to the client','Client approval or purchase order received','Contract signed; site access, PPE and induction confirmed'],
 audit:['Mobilise: induction, permits, equipment calibrated','Install or verify flow meters at inlet and outlet','Plan samples and generate sample codes','Run the composite sampling campaign at every stage','Take grab samples (pH, temperature, FOG, microbiology)','Sample individual sources (CIP rinses, product lines, drains)','Record daily field readings','Process tests: SV30/SVI, microscopy, DAF performance','Jar tests for coagulant and flocculant doses','Water balance from intake to discharge','Asset condition assessment for every unit','Sludge sampling and quantities','Operator interviews and review of logs','Chain of custody completed and samples delivered to the lab','Lab results received, checked and entered','Analysis: loads, removal efficiencies and limit exceedances','Root-cause analysis for each failing parameter','Draft the audit report and review internally','Present findings to the client'],

/* ---------- saving ---------- */
function setStatus(){
  const el=$('#saveStatus');
  if(!S.db){el.className='status';el.textContent=!S.dbChecked?'Connecting…':(S.auth&&S.auth.state==='signedout'?'Signed out':'Not connected');return}
  if(S.canWrite===false){el.className='status';el.textContent='View only';return}
  if(S.outbox.length){el.className='status err';el.textContent=`${S.outbox.length} unsaved · Retry`;return}
  if(S.pending){el.className='status busy';el.textContent='Saving…';return}
  el.className='status ok';el.textContent='All changes saved';
}
async function runOp(o){
  const ref=S.db.doc(o.path);
  if(o.op==='set') return ref.set(o.data);
  if(o.op==='delete') return ref.delete();
  if(o.op==='merge'&&ref.merge) return ref.merge(o.data);
  if(o.op==='merge'){ // section answers: update if exists, otherwise create
    const snap=await ref.get();
    if(snap.exists) return ref.update(o.data);
    return ref.set(o.data);
  }
  if(o.op==='update') return ref.update(o.data);
}
async function write(o){
  if(!S.db){toast('Not signed in. Sign in to save.');return false}
  S.pending++;setStatus();
  try{
    try{await runOp(o)}
    catch(e){if(e&&e.code==='unavailable'){await sleep(700+Math.random()*900);await runOp(o)}else throw e}
    return true;
  }catch(e){
    const code=e&&e.code;
    if(code==='invalid_argument'&&S.canWrite!==true){S.canWrite=false;toast('You have view-only access to this audit.');render();return false}
    if(code==='quota_exceeded'){toast('The audit database is full. Delete unused entries and try again.');return false}
    if(code==='revoked'){toast('Access to this audit has changed. Reload the page.');return false}
    queue(o);return false;
  }finally{S.pending--;setStatus()}
}
function queue(o){
  // keep only the latest write per path+op for merges
  S.outbox=S.outbox.filter(x=>!(x.path===o.path&&x.op==='set'&&o.op==='set'));
  S.outbox.push(o);ls.set('ce-outbox',S.outbox);setStatus();
}
async function flush(){
  if(!S.db||!S.outbox.length)return;
  const items=S.outbox.splice(0);ls.set('ce-outbox',S.outbox);setStatus();
  for(const o of items)await write(o);
  if(!S.outbox.length)toast('Offline changes saved.');
}

/* ---------- overview ---------- */
function flags(){
  const F=[];const A=(s,q)=>ans(s,q);
  const df=num(A('wwtp','design_flow')),af=num(A('wwtp','actual_flow')),dc=num(A('wwtp','design_cod')),ac=num(A('wwtp','actual_cod'));
  if(df&&af){const u=af/df*100;if(u>100)F.push(['bad',`WWTP hydraulically overloaded: current flow is ${Math.round(u)}% of design.`]);else if(u>85)F.push(['warn',`WWTP running at ${Math.round(u)}% of design flow; little spare capacity.`])}
  if(dc&&ac){const u=ac/dc*100;if(u>100)F.push(['bad',`Organic overload: COD load is ${Math.round(u)}% of design.`]);else if(u>85)F.push(['warn',`COD load at ${Math.round(u)}% of design.`])}
  const yr=num(A('wwtp','commissioned'));if(yr&&YEAR-yr>=15)F.push(['warn',`WWTP is ${YEAR-yr} years old (commissioned ${yr}).`]);
  const fail=A('compliance','failing');if(Array.isArray(fail)&&fail.length)F.push(['bad',`Failing parameters: ${fail.join(', ')}.`]);
  const yes=(s,q,msg,sev='warn')=>{if(A(s,q)==='Yes')F.push([sev,msg])};
  const no=(s,q,msg,sev='warn')=>{if(A(s,q)==='No')F.push([sev,msg])};
  yes('wwtp','bypass','Treatment units are being bypassed.','bad');
  yes('production','domestic','Domestic sewage is mixed with process effluent.');
  yes('production','storm','Stormwater enters the effluent drains.');
  no('production','segregation','High-strength streams are not segregated.');
  if(['Sometimes','Often'].includes(A('production','losses')))F.push(['warn',`Product losses go to drain (${A('production','losses').toLowerCase()}).`]);
  if(A('production','grease_traps')&&A('production','grease_traps')!=='Present, maintained')F.push(['warn',`Grease traps: ${A('production','grease_traps').toLowerCase()}.`]);
  if(A('cip','cip_dump')==='Dumped in one go')F.push(['bad','Spent CIP solutions are dumped in one go, causing pH and load shocks.']);
  no('cip','cip_recovery','CIP caustic and acid are not recovered.');
  if(['Not running','Intermittent'].includes(A('daf','daf_running')))F.push(['bad',`DAF is ${A('daf','daf_running').toLowerCase()}.`]);
  if(A('daf','daf_float')==='Not removed regularly')F.push(['warn','DAF float is not removed regularly.']);
  if(A('daf','ph_control')==='None')F.push(['warn','No pH control ahead of treatment.']);
  yes('bio','bulking','Bulking or rising sludge in the clarifier.','bad');
  no('bio','ras','Return sludge pumping is not working.','bad');
  const dox=num(A('bio','do_reading'));if(dox!==null&&dox<1.5)F.push(['bad',`Low dissolved oxygen in the reactor (${dox} mg/L).`]);
  no('dosing','jar_tests','Dosing is not optimised with jar tests.');
  no('dosing','sds','Safety data sheets are missing for some chemicals.');
  if(A('dosing','chem_store')==='Poor')F.push(['warn','Chemical store is in poor condition.']);
  no('om','sops','No written operating procedures.');no('om','logbook','No daily operating logs.');
  if(A('om','maint')==='Breakdown only')F.push(['warn','Maintenance is breakdown-only.']);
  yes('om','outages','The plant stops during power outages.');
  if(['Part-time','None'].includes(A('om','operator_cover')))F.push(['warn',`Operator cover: ${A('om','operator_cover').toLowerCase()}.`]);
  if(A('sludge','disposal')==='Stored on site'||A('sludge','disposal')==='Unknown')F.push(['warn',`Sludge disposal route: ${A('sludge','disposal').toLowerCase()}.`]);
  const eq=S.regs.equipment;
  const bad=eq.filter(e=>e.condition==='Not working'||e.status==='Out of service');if(bad.length)F.push(['bad',`${bad.length} equipment item${bad.length>1?'s':''} not working or out of service: ${bad.slice(0,4).map(e=>e.name||e.category).join(', ')}${bad.length>4?'…':''}.`]);
  const poor=eq.filter(e=>e.condition==='Poor');if(poor.length)F.push(['warn',`${poor.length} equipment item${poor.length>1?'s':''} in poor condition.`]);
  const old=eq.filter(e=>num(e.year)&&YEAR-num(e.year)>=15);if(old.length)F.push(['warn',`${old.length} equipment item${old.length>1?'s are':' is'} 15 years old or more.`]);
  const nosds=S.regs.chemicals.filter(c=>c.sds==='No');if(nosds.length)F.push(['warn',`No SDS for: ${nosds.map(c=>c.name||c.trade).join(', ')}.`]);
  S.regs.measurements.forEach(m=>{const p=num(m.ph),t=num(m.temp);const loc=m.location||'a sampling point';
    if(p!==null&&(p<6||p>9))F.push(['bad',`pH ${p} at ${loc.toLowerCase()}${m.time?' ('+m.time+')':''}.`]);
    if(t!==null&&t>35)F.push(['warn',`Temperature ${t} °C at ${loc.toLowerCase()}.`])});
  S.regs.observations.filter(o=>o.severity==='Critical').forEach(o=>F.push(['bad',o.title||'Critical observation']));
  {const M=measured(),df=num(A('wwtp','design_flow')),dc=num(A('wwtp','design_cod'));
   if(M.fin&&df&&M.fin.avg>df)F.push(['bad',`Measured flow averages ${fmtN(M.fin.avg)} m³/day over ${M.fin.n} day${M.fin.n>1?'s':''}: ${Math.round(M.fin.avg/df*100)}% of the ${fmtN(df)} m³/day design.`]);
   if(M.load!==null&&dc&&M.load>dc)F.push(['bad',`Measured COD load at the inlet is ${fmtN(M.load)} kg/day: ${Math.round(M.load/dc*100)}% of the ${fmtN(dc)} kg/day design.`]);}
  analysisRows().filter(r=>r.status==='Exceeds').forEach(r=>F.push(['bad',`${r.pr.label} at the final outlet breaks the limit in ${r.over} of ${r.so.n} samples (measured ${r.so.n>1?fmtN(r.so.min)+'–'+fmtN(r.so.max):fmtN(r.so.max)}${r.pr.unit?' '+r.pr.unit:''}; limit ${limText(r)}).`]));
  return F.sort((a,b)=>(a[0]==='bad'?0:1)-(b[0]==='bad'?0:1));
}
function viewOverview(){
  const a=S.audit;
  const totals=SECTIONS.reduce((acc,s)=>{const p=secProgress(s);acc.n+=p.n;acc.t+=p.t;return acc},{n:0,t:0});
  const pct=totals.t?Math.round(totals.n/totals.t*100):0;

async function loadTemplate(ph){

/* ---------- analysis ---------- */
function limitsOf(){return (S.audit&&S.audit.limits)||{}}
function resultRows(point){return S.regs.results.filter(r=>{const sm=sampleByCode(r.sample);return sm&&sm.point===point})}
function stats(vals){const v=vals.filter(x=>x!==null);if(!v.length)return null;return {n:v.length,avg:v.reduce((a,b)=>a+b,0)/v.length,max:Math.max(...v),min:Math.min(...v)}}
function fmtN(x){if(x===null||x===undefined||!isFinite(x))return '–';const a=Math.abs(x);return a>=100?Math.round(x).toLocaleString('en-GB'):a>=10?x.toFixed(1):x.toFixed(2)}
function analysisRows(){
  const L=limitsOf();const inl=resultRows('WWTP inlet'),out=resultRows('Final outlet');
  return PARAMS.map(pr=>{
    const si=stats(inl.map(r=>num(r['r_'+pr.id]))),so=stats(out.map(r=>num(r['r_'+pr.id])));
    const lim=L[pr.id]||{};const mx=num(lim.max),mn=num(lim.min);
    let status='',over=0;
    if(so&&(mx!==null||mn!==null)){out.forEach(r=>{const v=num(r['r_'+pr.id]);if(v===null)return;if((mx!==null&&v>mx)||(mn!==null&&v<mn))over++});status=over?'Exceeds':'Complies'}
    const rem=si&&so&&si.avg>0&&pr.id!=='ph'&&pr.id!=='temp'?(1-so.avg/si.avg)*100:null;
    return {pr,si,so,mx,mn,over,status,rem};
  }).filter(r=>r.si||r.so||r.mx!==null||r.mn!==null);
}
function viewAnalysis(){
  const L=limitsOf();const ro=readOnly();const rows=analysisRows();
  const fl=pt=>stats(S.regs.flows.filter(f=>f.point===pt).map(f=>num(f.flow)));
  const fin=fl('WWTP inlet')||fl('Final outlet');const df=num(ans('wwtp','design_flow')),dcod=num(ans('wwtp','design_cod'));
  const codIn=stats(resultRows('WWTP inlet').map(r=>num(r.r_cod)));const load=fin&&codIn?fin.avg*codIn.avg/1000:null;
  return `<div class="sechead"><div><h2>Audit analysis</h2><p class="intro" style="margin:4px 0 0">Calculated from the lab results, sample points and flow log. Inlet means samples at “WWTP inlet”; outlet means “Final outlet”.</p></div></div>
  <div class="stats" style="margin-bottom:16px">
   <div class="stat"><b>${fin?fmtN(fin.avg):'–'}</b><span>Average flow, m³/day${fin?` (${fin.n} day${fin.n>1?'s':''})`:''}</span></div>
   <div class="stat"><b>${fin&&df?Math.round(fin.avg/df*100)+'%':'–'}</b><span>Of design flow${df?` (${fmtN(df)} m³/day)`:' (enter design flow in the questionnaire)'}</span></div>
   <div class="stat"><b>${load!==null?fmtN(load):'–'}</b><span>COD load at inlet, kg/day</span></div>
   <div class="stat"><b>${load!==null&&dcod?Math.round(load/dcod*100)+'%':'–'}</b><span>Of design COD load</span></div>
   <div class="stat"><b>${rows.filter(r=>r.status==='Exceeds').length}</b><span>Parameters exceeding limits</span></div>
  </div>
  <section class="card" style="margin-bottom:16px"><div class="cardtitle">Results against limits</div>
   ${rows.length?`<div class="tablewrap" style="border:0"><table class="tbl"><thead><tr><th>Parameter</th><th>Unit</th><th>Inlet avg</th><th>Outlet avg</th><th>Outlet max</th><th>Limit</th><th>Removal</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.pr.label)}</b></td><td class="muted">${esc(r.pr.unit)}</td><td class="mono">${r.si?fmtN(r.si.avg)+` <span class="muted">(${r.si.n})</span>`:'–'}</td><td class="mono">${r.so?fmtN(r.so.avg)+` <span class="muted">(${r.so.n})</span>`:'–'}</td><td class="mono">${r.so?fmtN(r.so.max):'–'}</td><td class="mono">${limText(r)}</td><td class="mono">${r.rem!==null?Math.round(r.rem)+'%':'–'}</td><td>${r.status==='Exceeds'?`<span class="pill bad">Exceeds (${r.over}/${r.so.n})</span>`:r.status==='Complies'?'<span class="pill good">Complies</span>':'<span class="muted">No limit</span>'}</td></tr>`).join('')}</tbody></table></div>`
   :`<p class="muted" style="margin:0">Results appear here once lab results are entered for samples taken at the WWTP inlet and final outlet.</p>`}
  </section>
  <section class="card"><div class="cardtitle">Discharge limits</div>
   <p class="muted" style="margin:0 0 10px">Enter the limits from the client’s EPA permit (or the standard that applies). Final-outlet results are checked against them, and exceedances appear in the findings.</p>
   <div class="tablewrap" style="border:0"><table class="tbl limits" style="min-width:480px"><thead><tr><th>Parameter</th><th>Unit</th><th>Minimum</th><th>Maximum</th></tr></thead><tbody>${PARAMS.map(pr=>{const l=L[pr.id]||{};return `<tr><td>${esc(pr.label)}</td><td class="muted">${esc(pr.unit)}</td><td>${pr.id==='ph'?`<input class="inp" inputmode="decimal" data-limit="${pr.id}" data-lk="min" value="${esc(l.min??'')}" ${ro?'disabled':''} aria-label="${esc(pr.label)} minimum">`:''}</td><td><input class="inp" inputmode="decimal" data-limit="${pr.id}" data-lk="max" value="${esc(l.max??'')}" ${ro?'disabled':''} aria-label="${esc(pr.label)} maximum"></td></tr>`}).join('')}</tbody></table></div>
  </section>`;
}
function saveLimit(pid,key,val){
  if(readOnly()||!S.audit)return;const v=val.trim();
  S.audit.limits={...(S.audit.limits||{}),[pid]:{...((S.audit.limits||{})[pid]||{}),[key]:v}};
  write({op:'merge',path:'audits/'+S.auditId,data:{limits:{[pid]:{[key]:v}}}});
}
function limText(r){return r.mn!==null&&r.mx!==null?fmtN(r.mn)+'–'+fmtN(r.mx):r.mx!==null?'≤ '+fmtN(r.mx):r.mn!==null?'≥ '+fmtN(r.mn):'–'}
function measured(){const fl=pt=>stats(S.regs.flows.filter(f=>f.point===pt).map(f=>num(f.flow)));const fin=fl('WWTP inlet')||fl('Final outlet');const codIn=stats(resultRows('WWTP inlet').map(r=>num(r.r_cod)));return {fin,load:fin&&codIn?fin.avg*codIn.avg/1000:null}}
function costAmount(r){const q=num(r.qty),rt=num(r.rate);return q!==null&&rt!==null?q*rt:null}
function costTotals(){
  const by={};let all=0;S.regs.costing.forEach(r=>{const a=costAmount(r);if(a===null)return;const k=r.phase||'Unassigned';by[k]=(by[k]||0)+a;all+=a});
  const money=x=>'GHS '+Math.round(x).toLocaleString('en-GB');

function summary(k,r){

  if(k==='equipment'){t=r.name||r.category||'Unnamed item';m=[r.tag&&`<span class="mono">${esc(r.tag)}</span>`,esc(r.category&&r.name?r.category:''),esc([r.brand,r.model].filter(Boolean).join(' ')),esc(r.area||'')].filter(Boolean).join(' · ');
    const c={Good:'good',Fair:'info',Poor:'warn','Not working':'bad'}[r.condition];if(r.condition)pills.push(`<span class="pill ${c}">${esc(r.condition)}</span>`);
    if(r.status&&r.status!=='In service')pills.push(`<span class="pill ${r.status==='Out of service'?'bad':''}">${esc(r.status)}</span>`);
    if(num(r.year))pills.push(`<span class="pill">${YEAR-num(r.year)} yr old</span>`);
    if(num(r.cap))pills.push(`<span class="pill mono">${esc(r.cap)} ${esc(r.cap_unit||'')}</span>`)}
  if(k==='chemicals'){t=r.name||r.trade||'Unnamed chemical';m=[esc(r.trade&&r.name?r.trade:''),esc(r.purpose||''),esc(r.used_in||''),esc(r.supplier||'')].filter(Boolean).join(' · ');
    if(num(r.monthly))pills.push(`<span class="pill mono">${esc(r.monthly)} ${esc(r.monthly_unit||'')}/month</span>`);
    if(r.sds)pills.push(`<span class="pill ${r.sds==='Yes'?'good':r.sds==='No'?'bad':''}">SDS: ${esc(r.sds)}</span>`)}
  if(k==='products'){t=r.name||r.type||'Unnamed line';m=[esc(r.type||''),esc(r.packaging||'')].filter(Boolean).join(' · ');
    if(num(r.cap))pills.push(`<span class="pill mono">${esc(r.cap)} ${esc(r.cap_unit||'')}</span>`);if(num(r.cip))pills.push(`<span class="pill">${esc(r.cip)} CIP/day</span>`)}
  if(k==='measurements'){t=r.location||'Reading';m=[esc(r.location_detail||''),esc(r.time||'')].filter(Boolean).join(' · ');
    const p=num(r.ph);if(p!==null)pills.push(`<span class="pill mono ${p<6||p>9?'bad':''}">pH ${p}</span>`);
    if(num(r.temp)!==null)pills.push(`<span class="pill mono ${num(r.temp)>35?'warn':''}">${esc(r.temp)} °C</span>`);
    if(num(r.do)!==null)pills.push(`<span class="pill mono">DO ${esc(r.do)}</span>`);if(num(r.ec)!==null)pills.push(`<span class="pill mono">${esc(r.ec)} µS/cm</span>`);
    if(r.sample==='Yes')pills.push(`<span class="pill info">Sample ${esc(r.sample_id||'')}</span>`)}
  if(k==='samples'){t=r.code||'Code pending';m=[esc(r.point||''),esc(r.point_detail||''),esc(r.stype||''),esc([r.collected_date,r.time].filter(Boolean).join(' '))].filter(Boolean).join(' · ');
    const st=r.status||'Planned';pills.push(`<span class="pill ${{Planned:'',Collected:'info','Sent to lab':'warn','Results received':'good'}[st]}">${esc(st)}</span>`);
    if((r.params||[]).length)pills.push(`<span class="pill">${esc(r.params.join(', '))}</span>`)}
  if(k==='costing'){t=r.item||'Cost line';m=[esc(r.phase||''),esc(r.category||'')].filter(Boolean).join(' · ');
    if(num(r.qty)!==null)pills.push(`<span class="pill mono">${esc(r.qty)} ${esc(r.unit||'')}${num(r.rate)!==null?' × GHS '+esc(r.rate):''}</span>`);
    const a=costAmount(r);if(a!==null)pills.push(`<span class="pill info mono">GHS ${Math.round(a).toLocaleString('en-GB')}</span>`)}
  if(k==='results'){const sm=sampleByCode(r.sample);t=r.sample||'No sample code';m=[esc(sm?sm.point:''),esc(r.lab||''),esc(r.received?fmtDate(r.received):'')].filter(Boolean).join(' · ');
    const L=limitsOf();const isOut=sm&&sm.point==='Final outlet';
    PARAMS.forEach(pr=>{const v=num(r['r_'+pr.id]);if(v===null)return;const l=L[pr.id]||{};const bad=isOut&&((num(l.max)!==null&&v>num(l.max))||(num(l.min)!==null&&v<num(l.min)));pills.push(`<span class="pill mono ${bad?'bad':''}">${esc(pr.label)} ${esc(r['r_'+pr.id])}</span>`)})}
  if(k==='flows'){t=num(r.flow)!==null?`${fmtN(num(r.flow))} m³/day`:'Flow reading';m=[esc(r.date?fmtDate(r.date):''),esc(r.point||''),esc(r.method||'')].filter(Boolean).join(' · ')}
  if(k==='options'){t=r.title||'Option';m=[esc(r.category||''),esc((r.params||[]).join(', '))].filter(Boolean).join(' · ');
    if(r.priority)pills.push(`<span class="pill ${{High:'bad',Medium:'warn',Low:''}[r.priority]}">${esc(r.priority)} priority</span>`);
    if(r.status)pills.push(`<span class="pill ${{Agreed:'info',Implemented:'good',Rejected:''}[r.status]||''}">${esc(r.status)}</span>`);
    if(num(r.capex)!==null)pills.push(`<span class="pill mono">GHS ${Math.round(num(r.capex)).toLocaleString('en-GB')}</span>`)}
  if(k==='observations'){t=r.title||'Observation';m=esc(r.area||'');if(r.severity)pills.push(`<span class="pill ${{Info:'info',Concern:'warn',Critical:'bad'}[r.severity]}">${esc(r.severity)}</span>`)}
  const ph=(r.photos||[]).slice(0,4).map(id=>`<img data-photo="${esc(id)}" alt="">`).join('');
  return `<span class="t ${k==='samples'&&r.code?'code':''}">${esc(t)}</span>${m?`<span class="m">${m}</span>`:''}${pills.length?`<span class="p">${pills.join('')}</span>`:''}${ph?`<span class="thumbs">${ph}</span>`:''}<span class="m">${r.by||r.updatedAt?`Recorded ${r.updatedAt?when(r.updatedAt):''}${r.by?' by '+esc(who(r.by)):''}`:''}</span>`;
}
function filterField(k){return REGS[k].fields.find(x=>['area','category','purpose','location','point'].includes(x.id))}
function filteredRows(k){
  const f=S.filters[k];const af=filterField(k);
  let rows=S.regs[k].slice().sort(k==='samples'?(a,b)=>String(a.code||'').localeCompare(String(b.code||'')):(a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(f.a&&af)rows=rows.filter(r=>r[af.id]===f.a);
  if(f.q){const q=f.q.toLowerCase();rows=rows.filter(r=>Object.values(r).some(v=>(typeof v==='string'&&v.toLowerCase().includes(q))||(Array.isArray(v)&&v.join(' ').toLowerCase().includes(q))))}
  return rows;
}

/* ---------- editor sheet ---------- */
function openSheet(k,id,preset){
  const rec=id?S.regs[k].find(r=>r.id===id):null;
  const data=rec?JSON.parse(JSON.stringify(rec)):{};delete data.id;
  REGS[k].fields.forEach(fd=>{if(fd.unitField&&!data[fd.unitField])data[fd.unitField]=fd.units[0]});
  if(!id&&preset)Object.assign(data,preset);
  S.sheet={k,id:id||null,data,dirty:false,confirm:false};renderSheet();
}
function renderSheet(){
  const sh=S.sheet;const root=$('#sheetRoot');if(!sh){root.innerHTML='';document.body.style.overflow='';return}
  const R=REGS[sh.k];const ro=readOnly();
  const fields=R.fields.filter(q=>q.type!=='hidden'&&(!q.showIf||q.showIf(sh.data))).map(q=>`<div class="f"><label class="ql" for="r-${q.id}">${esc(q.label)}</label>${q.hint?`<span class="hint">${esc(q.hint)}</span>`:''}${qInput(q,sh.data[q.id],'r')}</div>`).join('');
  root.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
   <header class="gut"><h3 id="sheetTitle">${sh.id?'Edit':'New'} ${R.one}</h3><button class="btn ghost" type="button" data-act="close">Close</button></header>
   <div class="body gut" id="sheetBody">${fields}</div>
   <footer class="gut">${sh.confirm?`<div class="confirm">Delete this ${R.one}? <button class="btn danger" type="button" data-act="del-yes">Delete</button><button class="btn" type="button" data-act="del-no">Keep</button></div>`
     :`<div>${sh.id&&!ro?`<button class="btn danger" type="button" data-act="del">Delete</button>`:''}</div><div class="row"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" data-act="save" ${ro?'disabled':''}>Save</button></div>`}</footer>
  </div></div>`;
  document.body.style.overflow='hidden';renderSheetPhotos();
}
function renderSheetPhotos(){
  const sh=S.sheet;if(!sh)return;
  document.querySelectorAll('#sheetBody [data-photos]').forEach(el=>{
    const fid=el.dataset.photos;const ids=sh.data[fid]||[];
    const can=S.assets&&!readOnly();
    el.innerHTML=ids.map(id=>`<div class="photo"><img data-photo="${esc(id)}" alt="Photo"><button type="button" data-rmphoto="${esc(id)}" data-field="${fid}" aria-label="Remove photo" ${can?'':'hidden'}>×</button></div>`).join('')+
      (can?(sh.uploading?`<span class="addphoto">Uploading…</span>`:`<label class="addphoto cam" for="cam-${fid}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take photo<input id="cam-${fid}" type="file" accept="image/*" capture="environment" hidden data-upload="${fid}"></label><label class="addphoto" for="up-${fid}">From gallery<input id="up-${fid}" type="file" accept="image/*" multiple hidden data-upload="${fid}"></label>`):(ids.length?'':`<span class="hint">${'Photos can be added once you are signed in.'}</span>`));
  });
}
async function compress(file){
  try{const bmp=await createImageBitmap(file);const max=1600,s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82))}catch(e){return file}
}
async function upload(fid,files){
  const sh=S.sheet;if(!sh||!S.assets)return;sh.uploading=true;renderSheetPhotos();
  for(const f of files){
    try{const blob=await compress(f);const res=await S.assets.upload(blob,{type:blob.type&&blob.type.startsWith('image/')?blob.type:'image/jpeg'});
      sh.data[fid]=[...(sh.data[fid]||[]),res.id];sh.dirty=true;}
    catch(e){const c=e&&e.code;toast(c==='too_large'?'That photo is too large.':c==='unsupported_type'?'That file type is not supported. Use JPG or PNG.':c==='quota_or_state'?'Photo storage is full.':c==='rate_limited'?'Too many uploads at once. Wait a moment.':'Photo upload failed. Try again.');if(c==='store_unavailable'||!c)continue;break}
  }
  sh.uploading=false;renderSheetPhotos();
}
function collectSheet(){
  const sh=S.sheet;const body=$('#sheetBody');if(!body)return;
  body.querySelectorAll('input[data-q],textarea[data-q],select[data-q]').forEach(el=>{sh.data[el.dataset.q]=el.value.trim()});
}
async function saveSheet(){
  const sh=S.sheet;collectSheet();
  if(sh.k==='samples'){
    if(!sh.data.point){toast('Choose a sampling point first.');return}
    if(!sh.data.code||S.regs.samples.some(s=>s.id!==sh.id&&s.code===sh.data.code))sh.data.code=nextCode(sh.data.point,sh.data.collected_date);
    if(!sh.data.status)sh.data.status='Planned';
  }
  const id=sh.id||(sh.k.slice(0,3)+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5));
  const data={...sh.data,updatedAt:Date.now(),by:sh.data.by||S.uid||null,editedBy:S.uid||null};
  if(!sh.id)data.createdAt=Date.now();
  // optimistic close
  const k=sh.k;S.sheet=null;renderSheet();
  const ok=await write({op:'set',path:`audits/${S.auditId}/${k}/${id}`,data});
  toast(ok?`${REGS[k].one[0].toUpperCase()+REGS[k].one.slice(1)} saved.`:'Saved on this device; will sync when connected.');
}

/* ---------- sample codes & labels ---------- */
function clientCode(){const a=S.audit||{};if(a.code&&a.code.trim())return a.code.replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,6);
  const w=(a.client||'CE').split(/\s+/).filter(Boolean);return ((w.length>1?w.map(x=>x[0]).join(''):w[0].slice(0,3)).replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,4))||'CE'}
function nextCode(point,date,extra=[]){
  const d=(date||(S.audit&&S.audit.visitDate)||new Date().toISOString().slice(0,10)).replace(/-/g,'').slice(2,8);
  const prefix=`${clientCode()}-${d}-`;
  const used=[...S.regs.samples.map(s=>s.code),...extra].filter(c=>c&&c.startsWith(prefix));
  const max=used.reduce((m,c)=>Math.max(m,parseInt(c.split('-').pop(),10)||0),0);
  return `${prefix}${POINT_CODE[point]||'OT'}-${String(max+1).padStart(2,'0')}`;
}
function samplesTools(){
  const ro=readOnly();const pts=S.plan.plan_points||[];const P=S.plan;
  const coded=S.regs.samples.filter(s=>s.code);const planned=coded.filter(s=>(s.status||'Planned')==='Planned').length;
  const opt=(id,v,label)=>`<option value="${v}" ${String(P[id]??'')===String(v)?'selected':''}>${label}</option>`;
  return `<div class="grid2" style="margin-bottom:16px">
  <section class="card" id="planCard"><div class="cardtitle">Plan samples</div>
   <div class="f" style="border:0;padding-top:0"><span class="ql">Sampling points</span>
    <div class="chips" data-q="plan_points" data-kind="multi">${POINT_NAMES.map(p=>`<button type="button" data-v="${esc(p)}" aria-pressed="${pts.includes(p)}" ${ro?'disabled':''}>${esc(p)}</button>`).join('')}</div></div>
   <div class="f"><span class="ql">Sample type</span><div class="chips" data-q="plan_type" data-kind="single">${['Grab','Composite'].map(o=>`<button type="button" data-v="${o}" aria-pressed="${(P.plan_type||'Grab')===o}" ${ro?'disabled':''}>${o}</button>`).join('')}</div></div>
   <div class="f"><label class="ql" for="plan-n">Samples per point</label><select class="inp" id="plan-n" style="max-width:120px">${[1,2,3,4].map(n=>opt('plan-n',n,n)).join('')}</select><span class="hint">Analyses default to pH, BOD, COD, TSS and FOG for wastewater, and pH, turbidity, TDS and E. coli for water. Edit any sample to change them.</span></div>
   <div class="row" style="margin-top:6px"><button class="btn primary" type="button" data-act="plan-create" ${ro?'disabled':''}>Create planned samples</button></div>
  </section>
  <section class="card"><div class="cardtitle">Sample codes</div>
   <p class="muted" style="margin:0 0 10px">Codes read <span class="mono">${esc(clientCode())}-YYMMDD-POINT-NN</span>, for example <span class="mono">${esc(nextCode('Final outlet'))}</span>. The number never repeats within a day, so each bottle has its own code.</p>
   <p class="muted" style="margin:0">On site: tap <b>Add sample</b>, pick the sampling point, and write the code shown on the bottle. Change the client code under Visit details on the Overview.</p>
  </section></div>`;
}
async function planCreate(){
  if(readOnly())return;
  const pts=S.plan.plan_points||[];if(!pts.length){toast('Choose at least one sampling point.');return}
  const n=parseInt(S.plan['plan-n']||'1',10);const type=S.plan.plan_type||'Grab';
  const extra=[];const now=Date.now();let made=0;
  for(const p of pts)for(let i=0;i<n;i++){
    const code=nextCode(p,'',extra);extra.push(code);
    const rec={code,point:p,stype:type,params:defaultParams(p),status:'Planned',updatedAt:now,createdAt:now,by:S.uid||null};
    await write({op:'set',path:`audits/${S.auditId}/samples/sam-${now.toString(36)}-${made}`,data:rec});made++;
  }
  S.plan.plan_points=[];toast(`${made} planned sample${made===1?'':'s'} created.`);render();
}
function loadScript(src){return new Promise((res,rej)=>{const ex=document.querySelector(`script[src="${src}"]`);if(ex&&ex.dataset.ok){res();return}const s=ex||document.createElement('script');s.src=src;s.onload=()=>{s.dataset.ok='1';res()};s.onerror=rej;if(!ex)document.head.appendChild(s)})}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target;
  const sec=t.closest('[data-sec]');if(sec){S.section=sec.dataset.sec;if(S.view!=='questions'){go('questions',{section:sec.dataset.sec})}else{render();window.scrollTo({top:0})}return}
  const vg=t.closest('[data-view-go]');if(vg){go(vg.dataset.viewGo);return}
  const tk=t.closest('[data-tick]');if(tk){tickTask(tk.dataset.tick);return}
  const pg=t.closest('[data-phase-go]');if(pg){const P=phaseOf(pg.dataset.phaseGo);S.phase=P.id;go(P.views[0][0]);return}
  const sp=t.closest('[data-set-phase]');if(sp){saveAudit('phase',sp.dataset.setPhase);render();return}
  const ed=t.closest('[data-edit]');if(ed){openSheet(ed.dataset.k||S.view,ed.dataset.edit);return}
  const rm=t.closest('[data-rmphoto]');if(rm&&S.sheet){const f=rm.dataset.field;S.sheet.data[f]=(S.sheet.data[f]||[]).filter(x=>x!==rm.dataset.rmphoto);S.sheet.dirty=true;renderSheetPhotos();return}
  const chip=t.closest('.chips button');
  if(chip&&!chip.disabled){
    const g=chip.parentElement;const qid=g.dataset.q;
    let val;
    if(g.dataset.kind==='single'){const on=chip.getAttribute('aria-pressed')==='true';g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));if(!on)chip.setAttribute('aria-pressed','true');val=on?'':chip.dataset.v}
    else{chip.setAttribute('aria-pressed',String(chip.getAttribute('aria-pressed')!=='true'));val=[...g.querySelectorAll('button[aria-pressed="true"]')].map(b=>b.dataset.v)}
    if(g.closest('#planCard')){S.plan[qid]=val}
    else if(g.closest('#sheetBody')){S.sheet.data[qid]=val;S.sheet.dirty=true}else saveAnswer(qid,val);
    return;
  }
  const act=t.closest('[data-act]');if(!act)return;const a=act.dataset.act;
  if(a==='scrim'&&t!==act)return;
  if(a==='flush')flush();
  if(a==='audits')go('audits');
  if(a==='pick'){selectAudit(act.dataset.id);go('overview')}
  if(a==='back-sections'){S.section=null;render();window.scrollTo({top:0})}
  if(a==='to-overview'){S.section=null;go('overview')}
  if(a==='add')openSheet(S.view,null,S.view==='costing'?{phase:S.phase==='remediation'?'Remediation and retrofit':S.phase==='monitoring'?'Monitoring and aftercare':'Full audit'}:null);
  if(a==='add-task')openSheet('tasks',null,{phase:S.phase,status:'To do',order:999});
  if(a==='load-template')loadTemplate(S.phase);
  if(a==='close'||a==='scrim'){S.sheet=null;renderSheet()}
  if(a==='save')saveSheet();
  if(a==='del'){collectSheet();S.sheet.confirm=true;renderSheet()}
  if(a==='del-no'){S.sheet.confirm=false;renderSheet()}
  if(a==='del-yes'){const {k,id}=S.sheet;S.sheet=null;renderSheet();const ok=await write({op:'delete',path:`audits/${S.auditId}/${k}/${id}`});if(ok)toast('Deleted.')}
  if(a==='copy-code'){const c=S.sheet&&S.sheet.data.code;if(!c)return;
    navigator.clipboard.writeText(c).then(()=>toast('Code copied.'),()=>{const el=$('#codeVal');const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Code selected; copy it from the menu.')})}
  if(a==='plan-create')planCreate();
  if(a==='export-xlsx')exportXLSX();
  if(a==='signout')CE.signOut();
  if(a==='reload')location.reload();
  if(a==='export-json')exportJSON();
  if(a==='export-csv')exportCSV(act.dataset.k);
  if(a==='export-q')exportQ();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;renderSheet()}});
document.addEventListener('change',e=>{

  if(t.id==='flt-a'){S.filters[S.view].a=t.value;render();return}
  if(['plan-n','lab-which','lab-start'].includes(t.id)){S.plan[t.id]=t.value;return}

  if(t.dataset.audit){saveAudit(t.dataset.audit,t.value);return}
  if(t.dataset.limit){saveLimit(t.dataset.limit,t.dataset.lk,t.value);return}
  if(S.sheet&&t.closest('#sheetBody')&&t.dataset.q){const fd=REGS[S.sheet.k].fields.find(x=>x.id===t.dataset.q);if(fd&&fd.rerender){collectSheet();renderSheet();return}}
  if(t.dataset.q&&!t.closest('#sheetBody')&&t.closest('#qs')){clearTimeout(S.timers['q:'+t.dataset.q]);delete S.timers['q:'+t.dataset.q];commitInput(t)}
  if(t.closest('#sheetBody'))S.sheet&&(S.sheet.dirty=true);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='flt-q'){S.filters[S.view].q=t.value;const pos=t.selectionStart;render();const n=$('#flt-q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}
  if(t.dataset.q&&t.closest('#qs')&&t.tagName!=='SELECT'){const key='q:'+t.dataset.q;clearTimeout(S.timers[key]);S.timers[key]=setTimeout(()=>{delete S.timers[key];commitInput(t)},1400)}
});
function commitInput(t){
  const s=SECTIONS.find(x=>x.id===S.section);const q=s&&s.qs.find(x=>x.id===t.dataset.q);if(!q)return;
  const v=t.value.trim();const cur=ans(S.section,q.id);
  if(String(cur??'')===v)return;
  saveAnswer(q.id,v);
}
let auditTimer={};
function saveAudit(field,val){if(readOnly()||!S.audit)return;if((S.audit[field]||'')===val)return;S.audit[field]=val;write({op:'update',path:'audits/'+S.auditId,data:{[field]:val}})}

/* ---------- export ---------- */
function snapshotAll(){
  const qs={};SECTIONS.forEach(s=>{qs[s.id]={title:s.title,answers:Object.fromEntries(s.qs.map(q=>[q.label,answers(s.id)[q.id]??null]))}});
  const regs={};REG_KEYS.forEach(k=>regs[k]=S.regs[k]);
  return {audit:S.audit,exportedAt:new Date().toISOString(),questionnaire:qs,registers:regs,findings:flags().map(([s,t])=>({severity:s==='bad'?'Critical':'Concern',finding:t}))};
}
function slug(){return ((S.audit&&S.audit.client)||'audit').replace(/[^A-Za-z0-9]+/g,'_')}
async function save(filename,data){
  try{await S.downloads.save({filename,data});}
  catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'A save is already open.':'Download is not available here.')}
}
function exportJSON(){save(`${slug()}_site_audit.json`,JSON.stringify(snapshotAll(),null,2))}
const cell=v=>{v=Array.isArray(v)?v.join('; '):(v??'');v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const auditCols=()=>[S.audit.client||'',S.audit.site||'',S.audit.visitDate||''];
function exportCSV(k='equipment'){
  const f=REGS[k].fields.filter(x=>x.type!=='photos');
  const cols=[...f.flatMap(x=>x.unitField?[x,{id:x.unitField,label:x.label+' unit'}]:[x]),...(k==='equipment'?[{id:'_age',label:'Age (years)'}]:[]),{id:'_photos',label:'Photos'},{id:'_id',label:'Record ID'}];
  const lines=[['Client','Site','Visit date',...cols.map(c=>c.label)].map(cell).join(',')].concat(S.regs[k].map(r=>[...auditCols(),...cols.map(c=>c.id==='_age'?(num(r.year)?YEAR-num(r.year):''):c.id==='_photos'?(r.photos||[]).length:c.id==='_id'?r.id:r[c.id])].map(cell).join(',')));
  save(`${slug()}_${k}.csv`,'﻿'+lines.join('\r\n'));
}
function regRows(k){
  const f=REGS[k].fields.filter(x=>x.type!=='photos');
  const cols=[...f.flatMap(x=>x.unitField?[x,{id:x.unitField,label:x.label+' unit'}]:[x]),...(k==='equipment'?[{id:'_age',label:'Age (years)',type:'number'}]:[]),...(k==='costing'?[{id:'_amount',label:'Amount (GHS)',type:'number'}]:[]),{id:'_photos',label:'Photos',type:'number'},{id:'_by',label:'Recorded by'},{id:'_at',label:'Last updated'},{id:'_id',label:'Record ID'}];
  const val=(r,c)=>{let v=c.id==='_amount'?costAmount(r):(k==='tasks'&&c.id==='phase')?((phaseOf(r.phase)||{}).label||r.phase):c.id==='_age'?(num(r.year)?YEAR-num(r.year):''):c.id==='_photos'?(r.photos||[]).length:c.id==='_id'?r.id:c.id==='_by'?(S.names[r.by]||''):c.id==='_at'?(r.updatedAt?new Date(r.updatedAt).toISOString().slice(0,16).replace('T',' '):''):r[c.id];
    if(Array.isArray(v))v=v.join('; ');if(c.type==='number'&&num(v)!==null)return num(v);return v??''};
  return {headers:['Client','Site','Visit date',...cols.map(c=>c.label)],rows:S.regs[k].map(r=>[...auditCols(),...cols.map(c=>val(r,c))])};
}
async function exportXLSX(mode){
  toast(mode==='sp'?'Preparing workbook for SharePoint…':'Preparing workbook…');
  try{await loadScript('vendor/exceljs.min.js')}catch(e){toast('Could not load the Excel tools. Check the connection and try again.');return}
  const wb=new ExcelJS.Workbook();wb.creator='Cleanearth site audit';wb.created=new Date();
  const F=flags();
  const add=(sheet,table,headers,rows)=>{
    const ws=wb.addWorksheet(sheet);
    const uniq=[];headers.forEach(h=>{let n=h,i=2;while(uniq.includes(n))n=h+' '+(i++);uniq.push(n)});
    ws.addTable({name:table,ref:'A1',headerRow:true,style:{theme:'TableStyleMedium2',showRowStripes:true},columns:uniq.map(n=>({name:n,filterButton:true})),rows:rows.length?rows:[uniq.map(()=>'')]});
    ws.columns.forEach((c,i)=>{const w=Math.max(String(uniq[i]).length,...rows.slice(0,200).map(r=>String(r[i]??'').length));c.width=Math.min(60,Math.max(10,w+2))});
    ws.views=[{state:'frozen',ySplit:1}];
  };
  const a=S.audit;const tot=SECTIONS.reduce((x,s)=>{const p=secProgress(s);x.n+=p.n;x.t+=p.t;return x},{n:0,t:0});
  add('Summary','Summary',['Client','Site','Visit date','Industry','Cleanearth team','Status','Questions answered','Questions total','Equipment items','Chemicals','Product lines','Field readings','Samples','Observations','Critical findings','Concerns','Exported at','Audit ID'],
    [[a.client||'',a.site||'',a.visitDate||'',a.sector||'',a.team||'',a.status||'',tot.n,tot.t,S.regs.equipment.length,S.regs.chemicals.length,S.regs.products.length,S.regs.measurements.length,S.regs.samples.length,S.regs.observations.length,F.filter(f=>f[0]==='bad').length,F.filter(f=>f[0]!=='bad').length,new Date().toISOString().slice(0,16).replace('T',' '),S.auditId]]);
  add('Findings','Findings',['Client','Site','Visit date','Severity','Finding'],F.map(([sv,t])=>[...auditCols(),sv==='bad'?'Critical':'Concern',t]));
  add('Analysis','Analysis',['Client','Site','Visit date','Parameter','Unit','Inlet average','Inlet samples','Outlet average','Outlet maximum','Outlet samples','Limit minimum','Limit maximum','Removal %','Status','Samples exceeding'],
    analysisRows().map(r=>[...auditCols(),r.pr.label,r.pr.unit,r.si?+r.si.avg.toFixed(3):'',r.si?r.si.n:'',r.so?+r.so.avg.toFixed(3):'',r.so?r.so.max:'',r.so?r.so.n:'',r.mn??'',r.mx??'',r.rem!==null?Math.round(r.rem):'',r.status||'No limit',r.over||0]));
  const qrows=[];SECTIONS.forEach(s=>s.qs.forEach(q=>{let v=ans(s.id,q.id);if(Array.isArray(v))v=v.join('; ');if(q.type==='number'&&num(v)!==null)v=num(v);qrows.push([...auditCols(),s.title,s.id+'.'+q.id,q.label,q.unit||'',v??''])}));
  add('Questionnaire','Questionnaire',['Client','Site','Visit date','Section','Question ID','Question','Unit','Answer'],qrows);
  const names={tasks:['Checklist','Checklist'],costing:['Costing','Costing'],results:['Lab results','LabResults'],flows:['Flow log','FlowLog'],options:['Options','Options'],equipment:['Equipment','Equipment'],chemicals:['Chemicals','Chemicals'],products:['Product lines','ProductLines'],measurements:['Field readings','FieldReadings'],samples:['Samples','Samples'],observations:['Observations','Observations']};
  REG_KEYS.forEach(k=>{const {headers,rows}=regRows(k);const [sh,tb]=names[k]||[REGS[k].label,k];add(sh,tb,headers,rows)});
  const buf=await wb.xlsx.writeBuffer();
  const d=(a.visitDate||new Date().toISOString().slice(0,10));
  const name=`CE_Audit_${slug()}_${d}.xlsx`;const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  if(mode!=='sp'){save(name,blob);return}
  try{const r=await CE.uploadReport(name,blob);S.lastSent={name:r.name,url:r.webUrl,at:Date.now()};toast(`Sent to SharePoint as ${r.name}.`);if(S.view==='overview')render()}
  catch(e){toast(e&&e.code==='unavailable'?'No connection. Send to SharePoint again when you have signal.':'Could not save to SharePoint: '+((e&&e.message)||'unknown error'))}
}
function exportQ(){
  const lines=[['Client','Site','Visit date','Section','Question ID','Question','Answer'].map(cell).join(',')];
  SECTIONS.forEach(s=>s.qs.forEach(q=>{const v=ans(s.id,q.id);lines.push([...auditCols(),s.title,s.id+'.'+q.id,q.label+(q.unit?` (${q.unit})`:''),v??''].map(cell).join(','))}));
  save(`${slug()}_questionnaire.csv`,'﻿'+lines.join('\r\n'));
}

/* ---------- photos from SharePoint ---------- */
function hydratePhotos(root){
  (root||document).querySelectorAll('img[data-photo]:not([data-loaded])').forEach(img=>{
    img.setAttribute('data-loaded','1');
    if(!window.CE||!S.db)return;
    CE.photoURL(img.dataset.photo).then(u=>{img.src=u}).catch(()=>{img.alt='Photo unavailable offline'});
  });
}
new MutationObserver(()=>hydratePhotos()).observe(document.body,{childList:true,subtree:true});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

boot();
</script>
